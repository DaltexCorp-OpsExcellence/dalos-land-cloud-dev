<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>DalOS Land Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── Farm Structure Cloud — Vision structure, Teal & Sand palette (PRD §10) ── */
:root{
  --bg:#eef1f0;--bg2:#e0e8e6;--bg3:#cedad7;
  --sidebar:#0e3a3d;--sidebar2:#164c4f;
  --sidebar-text:#bdd8d6;--sidebar-muted:#5f8583;
  --accent:#0d6a68;--accent2:#159490;
  --amber:#b87820;--amber-bg:#fdf3e0;--amber-border:#e8c87a;
  --red:#b03030;--red-bg:#faeaea;--red-border:#e8a0a0;
  --green:#1e6b3a;--green-bg:#e8f5ec;--green-border:#8ecba4;
  --text:#111f1f;--text2:#3b4b4a;--text3:#6a7a79;
  --border:#c6d4d2;--border2:#aabdbb;--card:#ffffff;
  --font-display:'DM Serif Display',serif;
  --font-body:'Instrument Sans','Noto Sans Arabic',sans-serif;
  --font-mono:'DM Mono','Noto Sans Arabic',monospace;
  --r:8px;--r2:12px;
  --sidebar-w:218px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
input,button,select{font-family:inherit}
button{cursor:pointer}
.ar{unicode-bidi:plaintext}                 /* Arabic-in-LTR: resolve per-string (§11c) */
.mono{font-family:var(--font-mono)}

/* Shell */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-name{font-family:var(--font-display);font-size:19px;color:#fff;line-height:1}
.logo-sub{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sidebar-muted)}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.nav{padding:10px 8px;flex:1}
.nav-section{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--sidebar-muted);padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);font-size:13px;color:var(--sidebar-text);border:none;background:none;width:100%;text-align:left;transition:background .12s}
.nav-item svg{width:15px;height:15px;opacity:.65;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500}
.nav-item.active svg{opacity:1}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07);font-size:11px}
.side-user{color:#fff;font-size:12px}
.side-role{color:var(--sidebar-muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.side-link{color:var(--sidebar-text);background:none;border:none;font-size:11px;padding:6px 0 0;display:block}
.side-link:hover{color:#fff}
.side-build{color:var(--sidebar-muted);font-size:10px;margin-top:8px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:50px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}
.topbar h1{font-family:var(--font-display);font-size:17px;font-weight:400;color:var(--text)}
.topbar-spacer{flex:1}
.menu-btn{display:none;background:none;border:1px solid var(--border2);border-radius:var(--r);padding:5px 9px;color:var(--text2)}
.page{flex:1;overflow-y:auto;padding:16px}

/* Filters in topbar */
.tb-select{font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--text2)}
.tb-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600}

/* Cards / grids */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--text3)}
.kpi-val{font-family:var(--font-display);font-size:26px;line-height:1.1;margin-top:4px;color:var(--text)}
.kpi-sub{font-size:11px;margin-top:2px;color:var(--text3)}
.section-title{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin:4px 0 10px}
.section-title-bar{width:20px;height:2px;background:var(--accent);display:inline-block}

/* Badges */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:500;border:1px solid}
.badge-pass{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.badge-warn{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
.badge-fail{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.badge-neutral{background:var(--bg2);border-color:var(--border2);color:var(--text3)}

/* Buttons */
.btn{border-radius:var(--r);font-size:13px;font-weight:500;padding:7px 14px;border:1px solid transparent;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:#fff;border-color:var(--border2);color:var(--text2)}
.btn-secondary:hover{background:var(--bg2)}
.btn-sm{padding:4px 10px;font-size:12px}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2);background:#fff}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);text-align:left;padding:9px 12px;border-bottom:2px solid var(--border2);font-weight:600}
td{font-size:13px;color:var(--text2);padding:9px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.lot{font-family:var(--font-mono);font-size:11px;background:var(--bg2);border-radius:4px;padding:1px 6px}
.num{font-family:var(--font-mono);text-align:right}

/* Runtime states (§11c) */
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:5px;height:13px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.state{text-align:center;padding:44px 20px;color:var(--text3)}
.state-icon{width:40px;height:40px;margin:0 auto 12px;opacity:.5}
.state-title{font-size:15px;color:var(--text2);font-weight:500;margin-bottom:5px}
.state-msg{font-size:13px;max-width:420px;margin:0 auto 14px}
.state-err{color:var(--red)}

/* Staging badge (shared.md, byte-for-byte) */
.staging-badge{display:none;align-items:center;gap:7px;background:linear-gradient(135deg,#ff6b35 0%,#f7c948 100%);color:#fff;padding:5px 14px 5px 10px;border-radius:20px;box-shadow:0 3px 14px rgba(255,107,53,.45);font-size:10px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.staging-badge.on{display:inline-flex}
.staging-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);display:inline-block;flex-shrink:0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* Login */
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar)}
.login-card{background:#fff;border-radius:16px;padding:32px 30px;width:340px;max-width:90vw}
.login-title{font-family:var(--font-display);font-size:24px;text-align:center}
.login-sub{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);margin:6px 0 22px}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--text3);display:block;margin:12px 0 5px}
.form-input,.form-select{width:100%;border:1px solid var(--border2);border-radius:6px;padding:9px 10px;font-size:14px;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent)}

/* Register toolbar + chips */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:13px;background:#fff;color:var(--text)}
.search:focus{outline:none;border-color:var(--accent)}
.chip{border:1px solid var(--border2);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;color:var(--text2);display:inline-flex;gap:6px;align-items:center}
.chip .cnt{font-family:var(--font-mono);font-size:11px;background:var(--bg2);border-radius:10px;padding:0 6px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.active .cnt{background:rgba(255,255,255,.2);color:#fff}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--text3)}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--bg)}

/* Slide-over / bottom sheet (§6.3) */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;opacity:0;animation:fade .15s forwards}
@keyframes fade{to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:var(--bg);z-index:51;box-shadow:-4px 0 24px rgba(0,0,0,.14);display:flex;flex-direction:column;transform:translateX(100%);animation:slidein .22s cubic-bezier(.32,.72,0,1) forwards;overflow-y:auto}
@keyframes slidein{to{transform:translateX(0)}}
.drawer-head{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px}
.drawer-head h2{font-family:var(--font-display);font-size:19px;font-weight:400}
.drawer-body{padding:16px 18px}
.drawer-x{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:6px;width:28px;height:28px;color:var(--text2);font-size:16px;line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.kv dd{color:var(--text);font-family:var(--font-mono);font-size:12px}
.band{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--amber);margin:12px 0}
@media (max-width:700px){
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;height:82vh;border-radius:20px 20px 0 0;transform:translateY(100%);animation:sheetin .28s cubic-bezier(.32,.72,0,1) forwards}
  @keyframes sheetin{to{transform:translateY(0)}}
}

/* Season entry grid (mockup §6.5) */
.sgrid table{min-width:1080px}
.sgrid td{padding:3px 4px}
.sgrid input{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--text)}
.sgrid input:hover{border-color:var(--border)}
.sgrid input:focus{outline:none;border-color:var(--accent);background:#fff}
.sgrid input.derived{color:var(--text3);background:var(--bg2);border-color:transparent}
.stickyc{position:sticky;left:0;background:#fff;z-index:1}
thead .stickyc{background:var(--card)}
.bal{width:9px;height:9px;border-radius:50%;display:inline-block}
.bal-ok{background:var(--green)}.bal-off{background:var(--red)}.bal-res{background:var(--amber)}.bal-na{background:var(--border2)}
.carr{display:block;font-size:9px;color:var(--text3);margin-top:1px}
.carr.st{color:var(--accent)}
.alert{display:flex;gap:8px;padding:9px 11px;border-radius:8px;font-size:12px;align-items:flex-start;line-height:1.35}
.alert b{font-weight:600}
.alert-ok{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.alert-warn{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)}
.alert-fail{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.note{font-size:12px;color:var(--text3);background:var(--bg2);border-radius:8px;padding:9px 11px}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--text3);display:block;margin-bottom:4px}

/* Data Health issues (mockup §6.12) */
.issue{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--border)}
.issue:last-child{border-bottom:none}
.issue .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.issue .t{font-size:13px;font-weight:500;color:var(--text)}
.issue .d{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.45}
.issue .act{flex-shrink:0;align-self:center}
.st-red{color:var(--red)}.st-red .section-title-bar{background:var(--red)}
.st-amber{color:var(--amber)}.st-amber .section-title-bar{background:var(--amber)}

/* Bulk Import (mockup §6.6) */
.steps{display:flex;gap:0;margin-bottom:14px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:6px 16px 6px 10px;font-size:12px;color:var(--text3)}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--bg3);color:var(--text3);font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.step.done{color:var(--text2)}.step.done .n{background:var(--green);color:#fff}
.step.cur{color:var(--text);font-weight:500}.step.cur .n{background:var(--accent);color:#fff}
.drop{border:2px dashed var(--border2);border-radius:var(--r2);padding:26px;text-align:center;background:#fff;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--bg2)}
.drop .big{font-family:var(--font-display);font-size:17px;margin-bottom:4px}
.maprow{display:grid;grid-template-columns:1fr 22px 1fr 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.maprow:last-child{border-bottom:none}
.srccol{font-family:var(--font-mono);font-size:12px;color:var(--text);unicode-bidi:plaintext}
.arrow{color:var(--text3);text-align:center}

/* Farm Map (§6.13) */
.mapwrap{position:relative;height:calc(100vh - 92px);min-height:420px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--border)}
#farmmap{width:100%;height:100%}
.leaflet-container{background:#0e1a1a;font-family:var(--font-body)}
.mapctl{position:absolute;top:10px;right:10px;z-index:500;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:210px}
.mapctl .form-label{margin-top:6px}
.mapctl select{width:100%;font-size:12px;padding:4px 6px;border:1px solid var(--border2);border-radius:5px;background:#fff;color:var(--text)}
.bmw{display:flex;gap:3px;margin-top:5px}
.bmw button{flex:1;font-size:10px;padding:4px 2px;border:1px solid var(--border2);background:#fff;color:var(--text2);border-radius:5px}
.bmw button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.maplegend{margin-top:8px;max-height:180px;overflow-y:auto}
.maplegend .lgi{display:flex;align-items:center;gap:6px;font-size:11px;padding:1px 0}
.maplegend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.mapcov{position:absolute;bottom:10px;left:10px;z-index:500;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;font-size:11px;color:var(--text2);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.maphover{position:absolute;z-index:500;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 11px;font-size:12px;box-shadow:0 3px 14px rgba(0,0,0,.18);max-width:240px;pointer-events:none}

/* Mobile */
.sidebar-overlay{display:none}
.bottom-nav{display:none}
@media (max-width:1024px){
  :root{--sidebar-w:190px}
  .kpi-grid,.grid3{grid-template-columns:repeat(2,1fr)}
  .kpi-val{font-size:22px}
}
@media (max-width:767px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .menu-btn{display:inline-flex}
  .page{padding:14px;padding-bottom:70px}
  .kpi-grid,.grid2,.grid3{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--sidebar);z-index:30;overflow-x:auto}
  .bn-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 15px;color:var(--sidebar-muted);background:none;border:none;font-size:10px}
  .bn-item svg{width:18px;height:18px}
  .bn-item.active{color:#fff}
}
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- supabase-js pinned to 2.110.8 via jsDelivr — DalOS auth invariant -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
<!-- SheetJS for Bulk Import client-side parsing (§11d sanctioned) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Leaflet for the Farm Map (§11d sanctioned) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
"use strict";
var ce = React.createElement, useState = React.useState, useEffect = React.useEffect;

/* ── Supabase: shared DalOS client. No storageKey override → shares the default
   `sb-<ref>-auth-token` with Vision/Analytics/Workspace on the one Pages origin,
   which is how SSO works across the family. Do not add an idle timer that signs
   out (that caused the family-wide random sign-outs). ── */
var DALOS_SUPABASE_URL = 'https://sfyjvgjwvtwkrnqrvqyc.supabase.co';
var DALOS_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeWp2Z2p3dnR3a3JucXJ2cXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NzIxNjYsImV4cCI6MjA5MDQ0ODE2Nn0.FjA75XZsp0Kx5Xam_rrnYoAHX4JHKey6vEFCH_zlMuQ';
var supabase = window.supabase.createClient(DALOS_SUPABASE_URL, DALOS_ANON_KEY);
var BUILD = 'v0.1.0 (2026.08.10)';

/* ── Nav model. Screens are scaffolds in this shell; each maps to a PRD phase. ── */
function icon(paths){ return function(){ return ce('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, paths.map(function(d,i){return ce('path',{key:i,d:d});})); }; }
var IC = {
  structure: icon(['M3 3h7v7H3z','M14 3h7v7h-7z','M14 14h7v7h-7z','M3 14h7v7H3z']),
  register:  icon(['M3 4h18','M3 10h18','M3 16h18','M3 22h18']),
  map:       icon(['M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z','M9 3v15','M15 6v15']),
  history:   icon(['M3 3v18h18','M7 14l4-4 3 3 5-6']),
  entry:     icon(['M4 4h16v16H4z','M4 9h16','M9 4v16']),
  import:    icon(['M12 3v12','M8 11l4 4 4-4','M4 21h16']),
  recon:     icon(['M3 6h18','M3 12h12','M3 18h7','M18 5v6','M15 8h6']),

/* ── Squarified treemap layout (Bruls et al.) — ~50 lines, hand-rolled (§11d) ── */
function squarify(items, x0, y0, w0, h0){
  var out=[]; var nodes=items.filter(function(d){return d.value>0;}).slice().sort(function(a,b){return b.value-a.value;});
  var total=nodes.reduce(function(a,d){return a+d.value;},0); if(total<=0) return out;
  var x=x0,y=y0,w=w0,h=h0; var scale=(w0*h0)/total;
  var areas=nodes.map(function(d){return {d:d,a:d.value*scale};});
  function worst(row,side){ var s=row.reduce(function(a,r){return a+r.a;},0); var mx=Math.max.apply(null,row.map(function(r){return r.a;})); var mn=Math.min.apply(null,row.map(function(r){return r.a;})); return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn)); }
  var i=0;
  while(i<areas.length){
    var side=Math.min(w,h); var row=[areas[i]]; var j=i+1;
    while(j<areas.length){ if(worst(row.concat([areas[j]]),side)<=worst(row,side)){ row.push(areas[j]); j++; } else break; }
    var sum=row.reduce(function(a,r){return a+r.a;},0); var thick=sum/side;
    if(w<h){ var ox=x; row.forEach(function(r){ var rw=r.a/thick; out.push(Object.assign({},r.d,{x:ox,y:y,w:rw,h:thick})); ox+=rw; }); y+=thick; h-=thick; }
    else   { var oy=y; row.forEach(function(r){ var rh=r.a/thick; out.push(Object.assign({},r.d,{x:x,y:oy,w:thick,h:rh})); oy+=rh; }); x+=thick; w-=thick; }
    i=j;
  }
  return out;
}

  function bearingVal(row){ var ed=edits[row.block.id]; if(ed&&ed.bearing!==undefined) return ed.bearing; var s=row.season; return s.bearing_area_fed!=null?String(s.bearing_area_fed):''; }
  function bearingSrc(row){ var ed=edits[row.block.id]; if(ed&&ed.bearing!==undefined) return 'stated'; return (row.season.bearing_area_source)||null; }
  function metricVal(row,code){ var ed=edits[row.block.id]; if(ed&&ed.values&&ed.values[code]!==undefined) return ed.values[code]; var m=row.season.metrics||{}; return m[code]!=null?String(m[code]):''; }
  function editBearing(row,v){ setEdits(function(p){ var n=Object.assign({},p); n[row.block.id]=Object.assign({},n[row.block.id],{bearing:v}); return n; }); }
  function editMetric(row,code,v){ setEdits(function(p){ var n=Object.assign({},p); var r=Object.assign({},n[row.block.id]); r.values=Object.assign({},r.values); r.values[code]=v; n[row.block.id]=r; return n; }); }

  // live per-row status
  function rowStatus(row){
    var bearing=parseFloat(bearingVal(row)); var total=Number(row.block.total_area_fed);
    if(isFinite(bearing)&&bearing>total+0.001) return 'blocked';
    var actual=parseFloat(metricVal(row,'actual_production'));
    if(!isFinite(actual)) return 'na';
    var raw=parseFloat(metricVal(row,'raw_to_packhouse')); var sum=isFinite(raw)?raw:0, kids=isFinite(raw)?1:0;
    LOCAL_BRANCHES.forEach(function(c){ var v=parseFloat(metricVal(row,c)); if(isFinite(v)){sum+=v;kids++;} });
    if(kids<2) return 'na';
    var res=Math.abs(actual-sum); return (res<=0.5||res<=0.01*actual)?'ok':'off';
  }

  if(ctx.crop==='all') return ce('div',{className:'card'},ce(EmptyState,{title:'Pick a crop',msg:'Season Entry works one crop + farm + season at a time. Choose a crop in the top bar.'}));
  if(st.loading) return ce(Loading,{rows:8});
  if(st.err) return ce(ErrorState,{msg:st.err,onRetry:load});
  if(!st.cols.length) return ce('div',{className:'card'},ce(EmptyState,{title:'No metric set',msg:'No metric set defined for '+ctx.crop+' '+ctx.season+'. Define one in Reference Data (§6.11) first.'}));

  var editedIds=Object.keys(edits).filter(function(id){var ed=edits[id];return (ed.bearing!==undefined)||(ed.values&&Object.keys(ed.values).length);});
  var counts=st.rows.reduce(function(a,r){ var s=rowStatus(r); a[s]=(a[s]||0)+1; return a; },{});

  function doSave(){
    setSave({busy:true,msg:null,kind:null});
    var rows=editedIds.map(function(id){
      var ed=edits[id]; var s=(st.rows.filter(function(r){return r.block.id===id;})[0]||{}).season||{};
      var row={block_id:id, expected_updated_at:s.updated_at||null};
      if(ed.bearing!==undefined) row.bearing_area_fed = ed.bearing===''?null:Number(ed.bearing);
      if(ed.values){ var v={}; Object.keys(ed.values).forEach(function(c){ v[c]=ed.values[c]===''?null:Number(ed.values[c]); }); row.values=v; }
      return row;
    });
    supabase.rpc('fn_save_farm_season_full',{p_payload:{product_id:ctx.crop,season_year:ctx.season,scenario:'actual',rows:rows}}).then(function(r){
      if(r.error){ var m=r.error.message||''; setSave({busy:false,kind:'err',msg:/conflict_stale_season/.test(m)?'Someone else changed a row since you loaded — reload to see their edits.':('Save failed: '+m)}); return; }
      setSave({busy:false,kind:'ok',msg:'Saved '+(r.data&&r.data.saved||rows.length)+' rows.'}); load();
    });
  }

  var bal={ok:'bal-ok',off:'bal-off',blocked:'bal-off',na:'bal-na'};
  return ce('div',null,
    ce('div',{className:'card',style:{marginBottom:10}},
      ce('div',{style:{display:'flex',gap:10,alignItems:'flex-end',flexWrap:'wrap'}},
        ce('div',null, ce('label',{className:'form-label'},'Farm'),
          ce('select',{className:'tb-select',value:farm,onChange:function(ev){setFarm(ev.target.value);}}, farms.map(function(fm){return ce('option',{key:fm.code,value:fm.code},fm.name);}))),
        ce('div',null, ce('label',{className:'form-label'},'Metric set'), ce('div',{style:{fontSize:13,padding:'5px 0',fontFamily:'var(--font-mono)'}}, (st.setLabel||'—')+' · '+st.cols.length+' metrics')),
        ce('div',{style:{marginLeft:'auto',display:'flex',gap:8}},
          ce('button',{className:'btn btn-secondary btn-sm',disabled:!editedIds.length||save.busy,onClick:function(){setEdits({});}},'Discard'),
          ctx.canWrite?ce('button',{className:'btn btn-primary btn-sm',disabled:!editedIds.length||save.busy||counts.blocked,onClick:doSave}, save.busy?'Saving…':('Save '+editedIds.length+' rows')):ce('span',{style:{fontSize:11,color:'var(--text3)'}},'read-only role'))
      ),
      ce('div',{style:{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}},
        ce('div',{className:'alert alert-ok',style:{flex:1,minWidth:180}},ce('span',null,'✓'),ce('div',null,ce('b',null,(counts.ok||0)+' rows balance'),' · production = packhouse + local branches')),
        ce('div',{className:'alert alert-warn',style:{flex:1,minWidth:180}},ce('span',null,'⚠'),ce('div',null,ce('b',null,(counts.off||0)+' off by >0.5 t'),' · residual flagged, not blocked')),
        ce('div',{className:'alert alert-fail',style:{flex:1,minWidth:180}},ce('span',null,'✕'),ce('div',null,ce('b',null,(counts.blocked||0)+' blocked'),' · bearing area exceeds total'))
      ),
      save.msg?ce('div',{className:'alert '+(save.kind==='ok'?'alert-ok':'alert-fail'),style:{marginTop:8}},ce('span',null,save.kind==='ok'?'✓':'✕'),ce('div',null,save.msg)):null
    ),
    ce('div',{className:'card'},
      ce('div',{className:'section-title'},ce('span',{className:'section-title-bar'}),(farms.filter(function(x){return x.code===farm;})[0]||{}).name+' · '+ctx.crop+' · season '+ctx.season+' — '+st.rows.length+' blocks'),
      ce('div',{className:'table-wrap sgrid'},
        ce('table',null,
          ce('thead',null,ce('tr',null,
            ce('th',{className:'stickyc'},'Block'),
            ce('th',{className:'num'},'Total area'),ce('th',{className:'num'},'Bearing'),ce('th',{style:{textAlign:'center'}},'Bearing?'),
            st.cols.map(function(c){return ce('th',{key:c.code,className:'num',title:c.code},c.label);}),
            ce('th',{className:'num'},'t/fed'),ce('th',{style:{width:34,textAlign:'center'}},'Bal'))),
          ce('tbody',null, st.rows.map(function(row){
            var b=row.block; var status=rowStatus(row); var blocked=status==='blocked';
            var bv=bearingVal(row); var src=bearingSrc(row);
            var actual=parseFloat(metricVal(row,'actual_production')); var bn=parseFloat(bv);
            var tfed=(isFinite(actual)&&isFinite(bn)&&bn>0)?(actual/bn).toFixed(2):'';
            return ce('tr',{key:b.id},
              ce('td',{className:'stickyc'}, ce('span',{className:'lot'},b.operational_block_id), ce('div',{className:'ar',dir:'auto',style:{fontSize:10,color:'var(--text3)',marginTop:1}}, (b.varieties&&b.varieties.name)||'')),
              ce('td',null, ce('input',{className:'derived',readOnly:true,value:Number(b.total_area_fed).toFixed(2),title:'total_area_fed — lives on the block'})),
              ce('td',null, ce('input',{value:bv,disabled:!ctx.canWrite,style:blocked?{borderColor:'var(--red)',background:'var(--red-bg)'}:null,onChange:function(ev){editBearing(row,ev.target.value);}}),
                src?ce('span',{className:'carr'+(src==='stated'?' st':'')}, src):null),
              ce('td',{style:{textAlign:'center'}}, ce('span',{className:'badge '+(bn>0?'badge-pass':'badge-neutral'),style:{fontSize:10}}, bn>0?'P':'NP')),
              st.cols.map(function(c){ return ce('td',{key:c.code}, ce('input',{value:metricVal(row,c.code),disabled:!ctx.canWrite,style:c.role==='total'?{fontWeight:600}:null,onChange:function(ev){editMetric(row,c.code,ev.target.value);}})); }),
              ce('td',null, ce('input',{className:'derived',readOnly:true,value:tfed})),
              ce('td',{style:{textAlign:'center'}}, ce('span',{className:'bal '+(bal[status]||'bal-na'),title:status})));
          }))
        )),
      ce('div',{className:'note',style:{marginTop:10}}, ce('b',null,'Bearing area is carried, not re-typed.'),' Each cell pre-fills from the last season it was stated (shown below the value). Touch one and it becomes ',ce('span',{className:'lot'},'stated'),' from this season on. Total area is grey — it lives on the block, not the season.'),
      ce('div',{className:'note',style:{marginTop:8}}, ce('b',null,'Columns come from the metric set,'),' not hard-coded — adding a 2027 segment is one row in ',ce('span',{className:'lot'},'farm_metric_set_items'),', no migration. Grey cells are derived and never stored.')
    )
  );
}

/* ── Access gate: farm_can_read() decides entry; users.role gates writes. ── */
function App(){
  var a=useState({phase:'boot',session:null,role:null,canRead:false}); var auth=a[0], setAuth=a[1];
  var n=useState('structure'); var screen=n[0], setScreen=n[1];
  var c=useState('all'); var crop=c[0], setCrop=c[1];
  var y=useState(2025); var season=y[0], setSeason=y[1];
  var p=useState([]); var products=p[0], setProducts=p[1];
  var m=useState(false); var menuOpen=m[0], setMenu=m[1];

  useEffect(function(){
    var sub = supabase.auth.onAuthStateChange(function(_e, sess){ boot(sess); });
    supabase.auth.getSession().then(function(r){ boot(r.data.session); });
    return function(){ try{ sub.data.subscription.unsubscribe(); }catch(e){} };
  }, []);

  function boot(sess){
    if(!sess){ setAuth({phase:'login',session:null,role:null,canRead:false}); return; }
    Promise.all([
      supabase.rpc('farm_can_read'),
      supabase.from('users').select('role,full_name,email').eq('id', sess.user.id).maybeSingle()
    ]).then(function(r){
      var canRead = r[0].data === true;
      var row = r[1].data || {};
      setAuth({phase: canRead?'in':'noaccess', session:sess, role:row.role||null, name:row.full_name||sess.user.email, canRead:canRead});
    }).catch(function(){ setAuth({phase:'noaccess',session:sess,role:null,canRead:false}); });
  }
  useEffect(function(){ // crop list, once we're in
    if(auth.phase!=='in') return;
    supabase.from('products').select('id,name,color,bg_color,border_color').then(function(r){
      var rows=(r.data||[]).filter(function(x){ return ['citrus','grapes','mango','pomegranate','olives','berries'].indexOf(x.id)>=0; });
      setProducts(rows);
    });
  }, [auth.phase]);

  if(auth.phase==='boot') return ce('div',{className:'login-wrap'}, ce('div',{style:{color:'#fff',fontFamily:'var(--font-display)',fontSize:22}},'DalOS Land Cloud'));
  if(auth.phase==='login') return ce(Login,null);
  if(auth.phase==='noaccess') return ce(NoAccess,{email:(auth.session&&auth.session.user.email)});

  var role = auth.role;
  var isAdmin = ['admin','power_user'].indexOf(role)>=0;
  var canWrite = isAdmin || role==='agronomy_admin';
  var visible = function(it){ if(it.need==='admin') return isAdmin; return true; };
  var ctx = {crop:crop, season:season, role:role, canWrite:canWrite, isAdmin:isAdmin, products:products, go:setScreen};
  var scr = SCREENS[screen];

  return ce('div',{className:'app'},
    ce('div',{className:'sidebar-overlay'+(menuOpen?' on':''),onClick:function(){setMenu(false);}}),
    ce('div',{className:'sidebar'+(menuOpen?' open':'')},
      ce('div',{className:'logo'},
        ce('div',{className:'logo-name'}, 'DalOS'),
        ce('div',{className:'logo-sub'}, ce('span',{className:'logo-dot'}), 'Farm Structure')),
      ce('div',{className:'nav'}, NAV.map(function(g){
        return ce('div',{key:g.sec},
          ce('div',{className:'nav-section'}, g.sec),
          g.items.filter(visible).map(function(it){
            return ce('button',{key:it.k,className:'nav-item'+(screen===it.k?' active':''),onClick:function(){setScreen(it.k);setMenu(false);}},
              ce(it.Icon,null), ce('span',null, it.label),
              it.v2?ce('span',{style:{marginLeft:'auto',fontSize:9,opacity:.6}},'v2'):null);
          }));
      })),
      ce('div',{className:'side-foot'},
        ce('div',{className:'side-user'}, auth.name||'—'),
        ce('div',{className:'side-role'}, role||'no role'),
        ce('button',{className:'side-link',onClick:function(){ window.location.href='https://daltexcorp-opsexcellence.github.io/dalos-workspace/'; }}, '← Workspace'),
        ce('button',{className:'side-link',onClick:function(){ supabase.auth.signOut(); }}, 'Sign out'),
        ce('div',{className:'side-build'}, BUILD))
    ),
    ce('div',{className:'main'},
      ce('div',{className:'topbar'},
        ce('button',{className:'menu-btn',onClick:function(){setMenu(!menuOpen);}}, '☰'),
        ce('h1',null, scr.title),
        ce('div',{className:'topbar-spacer'}),
        ce('span',{className:'tb-label'},'Crop'),
        ce('select',{className:'tb-select',value:crop,onChange:function(e){setCrop(e.target.value);}},
          ce('option',{value:'all'},'All crops'),
          products.map(function(pr){ return ce('option',{key:pr.id,value:pr.id}, pr.name); })),
        ce('span',{className:'tb-label'},'Season'),
        ce('select',{className:'tb-select',value:season,onChange:function(e){setSeason(+e.target.value);}},
          [2025,2024,2023,2022,2021,2020,2019,2018,2017].map(function(yy){ return ce('option',{key:yy,value:yy}, yy); })),
        ce('span',{className:'staging-badge'+(location.pathname.indexOf('-dev/')>=0?' on':''),title:'Staging environment'},
          ce('span',{className:'staging-dot'}), 'Staging')
      ),
      ce('div',{className:'page'},
        scr.body ? scr.body(ctx) : ce(Scaffold,{title:scr.title,phase:scr.phase,msg:scr.msg})
      )
    ),
    ce('div',{className:'bottom-nav'}, NAV.reduce(function(acc,g){ return acc.concat(g.items.filter(visible)); },[]).map(function(it){
      return ce('button',{key:it.k,className:'bn-item'+(screen===it.k?' active':''),onClick:function(){setScreen(it.k);}},
        ce(it.Icon,null), ce('span',null, it.label.split(' ')[0]));
    }))
  );
}

/* ── Login (users type their own credentials; SSO session usually pre-exists) ── */
function Login(){
  var e=useState(''); var f=useState(''); var b=useState({busy:false,err:null});
  var email=e[0],setEmail=e[1], pw=f[0],setPw=f[1], st=b[0],setSt=b[1];
  function submit(ev){ ev.preventDefault(); setSt({busy:true,err:null});
    supabase.auth.signInWithPassword({email:email.trim(),password:pw}).then(function(r){
      if(r.error) setSt({busy:false,err:r.error.message});
    }); }
  return ce('div',{className:'login-wrap'},
    ce('form',{className:'login-card',onSubmit:submit},
      ce('div',{className:'login-title'},'DalOS Land Cloud'),
      ce('div',{className:'login-sub'},'Farm Structure Cloud'),
      ce('label',{className:'form-label'},'Email'),
      ce('input',{className:'form-input',type:'email',value:email,onChange:function(e){setEmail(e.target.value);},autoComplete:'username'}),
      ce('label',{className:'form-label'},'Password'),
      ce('input',{className:'form-input',type:'password',value:pw,onChange:function(e){setPw(e.target.value);},autoComplete:'current-password'}),
      st.err? ce('div',{style:{color:'var(--red)',fontSize:12,marginTop:10}}, st.err):null,
      ce('button',{className:'btn btn-primary',style:{width:'100%',marginTop:18},disabled:st.busy,type:'submit'}, st.busy?'Signing in…':'Sign in')
    ));
}
function NoAccess(p){
  return ce('div',{className:'login-wrap'},
    ce('div',{className:'login-card'},
      ce('div',{className:'login-title',style:{fontSize:20}},'No access'),
      ce('div',{style:{fontSize:13,color:'var(--text2)',textAlign:'center',marginTop:12,lineHeight:1.6}},
        'Your account'+(p.email?(' ('+p.email+')'):'')+' is not granted to Farm Structure Cloud. Ask an admin for the agronomy or commercial role.'),
      ce('button',{className:'btn btn-secondary',style:{width:'100%',marginTop:20},onClick:function(){ supabase.auth.signOut(); }}, 'Sign out')));
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));
</script>
