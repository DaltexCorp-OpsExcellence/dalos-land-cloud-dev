<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>DalOS Land Cloud</title>
<meta name="theme-color" content="#0e3a3d"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='13' fill='%230e3a3d'/><path d='M17 25 L30 15 L46 20 L50 34 L36 47 L20 41 Z' fill='%238fe0ad'/><g fill='%235fc9c4'><circle cx='10' cy='22' r='4'/><circle cx='27' cy='7' r='4'/><circle cx='51' cy='14' r='4'/><circle cx='56' cy='36' r='4'/><circle cx='39' cy='55' r='4'/><circle cx='15' cy='47' r='4'/></g></svg>"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='13' fill='%230e3a3d'/><path d='M17 25 L30 15 L46 20 L50 34 L36 47 L20 41 Z' fill='%238fe0ad'/><g fill='%235fc9c4'><circle cx='10' cy='22' r='4'/><circle cx='27' cy='7' r='4'/><circle cx='51' cy='14' r='4'/><circle cx='56' cy='36' r='4'/><circle cx='39' cy='55' r='4'/><circle cx='15' cy='47' r='4'/></g></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── Farm Structure Cloud — Vision structure, Teal & Sand palette (PRD §10) ── */
:root{
  --bg:#eef1f0;--bg2:#e0e8e6;--bg3:#cedad7;
  --sidebar:#0e3a3d;--sidebar2:#164c4f;
  --sidebar-text:#bdd8d6;--sidebar-muted:#5f8583;
  --accent:#0d6a68;--accent2:#159490;
  --amber:#b87820;--amber-bg:#fdf3e0;--amber-border:#e8c87a;
  --red:#b03030;--red-bg:#faeaea;--red-border:#e8a0a0;
  --green:#1e6b3a;--green-bg:#e8f5ec;--green-border:#8ecba4;
  --text:#111f1f;--text2:#3b4b4a;--text3:#6a7a79;
  --border:#c6d4d2;--border2:#aabdbb;--card:#ffffff;
  --font-display:'DM Serif Display',serif;
  --font-body:'Instrument Sans','Noto Sans Arabic',sans-serif;
  --font-mono:'DM Mono','Noto Sans Arabic',monospace;
  --r:8px;--r2:12px;
  --sidebar-w:218px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
input,button,select{font-family:inherit}
button{cursor:pointer}
.ar{unicode-bidi:plaintext}                 /* Arabic-in-LTR: resolve per-string (§11c) */
.mono{font-family:var(--font-mono)}

/* Shell */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo-name{font-family:var(--font-display);font-size:19px;color:#fff;line-height:1}
.logo-sub{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sidebar-muted)}
.logo-dot{width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.nav{padding:10px 8px;flex:1}
.nav-section{font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--sidebar-muted);padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);font-size:13px;color:var(--sidebar-text);border:none;background:none;width:100%;text-align:left;transition:background .12s}
.nav-item svg{width:15px;height:15px;opacity:.65;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.05)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500}
.nav-item.active svg{opacity:1}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07);font-size:11px}
.side-user{color:#fff;font-size:12px}
.side-role{color:var(--sidebar-muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.side-link{color:var(--sidebar-text);background:none;border:none;font-size:11px;padding:6px 0 0;display:block}
.side-link:hover{color:#fff}
.side-build{color:var(--sidebar-muted);font-size:10px;margin-top:8px}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:50px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10}
.topbar h1{font-family:var(--font-display);font-size:17px;font-weight:400;color:var(--text)}
.topbar-spacer{flex:1}
.menu-btn{display:none;background:none;border:1px solid var(--border2);border-radius:var(--r);padding:5px 9px;color:var(--text2)}
.page{flex:1;overflow-y:auto;padding:16px}

/* Filters in topbar */
.tb-select{font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--text2)}
.tb-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600}

/* Cards / grids */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
.kpi-label{font-size:11px;color:var(--text3)}
.kpi-val{font-family:var(--font-display);font-size:26px;line-height:1.1;margin-top:4px;color:var(--text)}
.kpi-sub{font-size:11px;margin-top:2px;color:var(--text3)}
.section-title{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin:4px 0 10px}
.section-title-bar{width:20px;height:2px;background:var(--accent);display:inline-block}

/* Badges */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:500;border:1px solid}
.badge-pass{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.badge-warn{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
.badge-fail{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.badge-neutral{background:var(--bg2);border-color:var(--border2);color:var(--text3)}

/* Buttons */
.btn{border-radius:var(--r);font-size:13px;font-weight:500;padding:7px 14px;border:1px solid transparent;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-secondary{background:#fff;border-color:var(--border2);color:var(--text2)}
.btn-secondary:hover{background:var(--bg2)}
.btn-sm{padding:4px 10px;font-size:12px}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2);background:#fff}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);text-align:left;padding:9px 12px;border-bottom:2px solid var(--border2);font-weight:600}
td{font-size:13px;color:var(--text2);padding:9px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.lot{font-family:var(--font-mono);font-size:11px;background:var(--bg2);border-radius:4px;padding:1px 6px}
.num{font-family:var(--font-mono);text-align:right}

/* Runtime states (§11c) */
.skel{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:5px;height:13px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.state{text-align:center;padding:44px 20px;color:var(--text3)}
.state-icon{width:40px;height:40px;margin:0 auto 12px;opacity:.5}
.state-title{font-size:15px;color:var(--text2);font-weight:500;margin-bottom:5px}
.state-msg{font-size:13px;max-width:420px;margin:0 auto 14px}
.state-err{color:var(--red)}

/* Staging badge (shared.md, byte-for-byte) */
.staging-badge{display:none;align-items:center;gap:7px;background:linear-gradient(135deg,#ff6b35 0%,#f7c948 100%);color:#fff;padding:5px 14px 5px 10px;border-radius:20px;box-shadow:0 3px 14px rgba(255,107,53,.45);font-size:10px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.staging-badge.on{display:inline-flex}
.staging-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);display:inline-block;flex-shrink:0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* Login */
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar)}
.login-card{background:#fff;border-radius:16px;padding:32px 30px;width:340px;max-width:90vw}
.login-title{font-family:var(--font-display);font-size:24px;text-align:center}
.login-sub{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);margin:6px 0 22px}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--text3);display:block;margin:12px 0 5px}
.form-input,.form-select{width:100%;border:1px solid var(--border2);border-radius:6px;padding:9px 10px;font-size:14px;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent)}

/* Register toolbar + chips */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:13px;background:#fff;color:var(--text)}
.search:focus{outline:none;border-color:var(--accent)}
.chip{border:1px solid var(--border2);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;color:var(--text2);display:inline-flex;gap:6px;align-items:center}
.chip .cnt{font-family:var(--font-mono);font-size:11px;background:var(--bg2);border-radius:10px;padding:0 6px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.active .cnt{background:rgba(255,255,255,.2);color:#fff}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--text3)}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--bg)}

/* Slide-over / bottom sheet (§6.3) */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;opacity:0;animation:fade .15s forwards}
@keyframes fade{to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;background:var(--bg);z-index:51;box-shadow:-4px 0 24px rgba(0,0,0,.14);display:flex;flex-direction:column;transform:translateX(100%);animation:slidein .22s cubic-bezier(.32,.72,0,1) forwards;overflow-y:auto}
@keyframes slidein{to{transform:translateX(0)}}
.drawer-head{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px}
.drawer-head h2{font-family:var(--font-display);font-size:19px;font-weight:400}
.drawer-body{padding:16px 18px}
.drawer-x{margin-left:auto;background:none;border:1px solid var(--border2);border-radius:6px;width:28px;height:28px;color:var(--text2);font-size:16px;line-height:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.kv dd{color:var(--text);font-family:var(--font-mono);font-size:12px}
.band{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--amber);margin:12px 0}
/* ── Modal (write actions) ── */
.modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;animation:fade .15s forwards}
.modal-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.22);width:460px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;transform:translateY(8px);animation:popin .18s cubic-bezier(.32,.72,0,1) forwards}
.modal-card.wide{width:600px}
@keyframes popin{to{transform:translateY(0)}}
.modal-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{font-family:var(--font-display);font-size:18px;font-weight:400}
.modal-head .sub{font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;justify-content:flex-end}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#a8342b}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.45}
.form-input:disabled,.form-select:disabled{background:var(--bg2);color:var(--text3)}
.action-row{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 4px}
.child-card{border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin-bottom:9px;background:var(--bg2)}
.ok-band{background:color-mix(in srgb,var(--green) 10%,transparent);border:1px solid color-mix(in srgb,var(--green) 35%,transparent);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--green);margin:12px 0}
.modal-card.xwide{width:680px}
.cc-glabel{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);font-weight:600;display:flex;align-items:center;gap:6px;margin:11px 0 6px}
.cc-glabel .tick{width:12px;height:2px;background:var(--border2);display:inline-block}
.area-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 10px;display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:10px}
.area-primary{border-left:3px solid var(--accent);padding-left:8px;margin-left:-1px}
.area-primary .form-label{color:var(--accent)}
.unit{color:var(--text3);font-size:10px;font-family:var(--font-mono);margin-top:3px}
.recon-bar{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:12.5px;padding:9px 11px;border-radius:8px;border:1px solid;margin-top:2px}
.recon-ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.recon-off{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.geo-block{display:flex;gap:12px;align-items:stretch;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px}
.geo-thumb{width:104px;height:80px;flex-shrink:0;border-radius:7px;border:1px solid var(--border2);background:#0e1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.geo-thumb.empty{border-style:dashed;background:var(--bg2);color:var(--text3)}
.geo-meta{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
.geo-read{font-family:var(--font-mono);font-size:14px;color:var(--text);font-weight:500}
.geo-actions{display:flex;gap:7px;margin-top:2px}
.dedup{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:7px;padding:7px 10px;font-size:11.5px;color:var(--amber);margin-top:8px;display:flex;gap:7px;align-items:flex-start}
.seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:3px;margin:4px 0 12px}
.seg button{flex:1;border:none;background:none;border-radius:6px;padding:8px 6px;font-size:12.5px;font-weight:500;color:var(--text2);line-height:1.25;cursor:pointer}
.seg button .s{display:block;font-size:10px;font-weight:400;color:var(--text3);margin-top:2px}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on .s{color:rgba(255,255,255,.75)}
.smart-chip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--accent2) 12%,#fff);border:1px solid color-mix(in srgb,var(--accent2) 45%,var(--border2));color:var(--accent);border-radius:20px;padding:3px 9px 3px 8px;font-size:11.5px;cursor:pointer}
.smart-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.plot-list{border:1px solid var(--border);border-radius:8px;background:#fff;max-height:200px;overflow-y:auto}
.plot-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer}
.plot-row:last-child{border-bottom:none}
.plot-row.on{background:color-mix(in srgb,var(--accent) 7%,#fff)}
.plot-row .rd{width:15px;height:15px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0}
.plot-row.on .rd{border-color:var(--accent);background:radial-gradient(var(--accent) 42%,#fff 46%)}
.readout-strip{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:12px}
.readout-strip .geo-thumb{width:70px;height:54px}
.minimap{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#0e1a1a}
.splitmap-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.leg{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;background:#fff}
.leg .sw{width:15px;height:10px;border-radius:2px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
.leg .ln{font-family:var(--font-mono);font-size:11.5px}
.child-geo{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--font-mono);color:var(--text3);margin-top:9px}
.child-geo .dotc{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* Yield Heatmap + Benchmark (v2) */
.hm-table{border-collapse:separate;border-spacing:3px}
.hm-table th{font-size:10px;color:var(--text3);font-weight:500;font-family:var(--font-mono);padding:1px 4px;text-align:center;white-space:nowrap}
.hm-table td{padding:0}
.hm-table td.rowlbl{padding-right:8px;position:sticky;left:0;background:var(--card);z-index:1}
.hm-cell{display:block;min-width:30px;height:22px;border-radius:3px;font-family:var(--font-mono);font-size:10.5px;line-height:22px;text-align:center}
.hm-pre{background:repeating-linear-gradient(45deg,#e4e0d6,#e4e0d6 3px,#dbd6ca 3px,#dbd6ca 6px)}
.hm-grub{background:var(--bg3)}
.hm-nodata{background:#fff;border:1px dashed var(--border2);line-height:20px;color:var(--border2)}
.hm-lbl{font-family:var(--font-mono);font-size:11px;color:var(--text)}
.bt-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.bt-tab{border:1px solid var(--border2);background:#fff;color:var(--text2);border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer}
.bt-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mx-cell{font-family:var(--font-mono);font-size:12px;text-align:center;padding:7px 6px;border-radius:4px;white-space:nowrap}
.devrow{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px solid var(--border)}
.devrow .nm{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.devrow .track{flex:1;height:16px;position:relative;background:var(--bg2);border-radius:3px}
.devrow .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--border2)}
.devrow .fillp{position:absolute;left:50%;top:2px;bottom:2px;border-radius:0 3px 3px 0}
.devrow .filln{position:absolute;right:50%;top:2px;bottom:2px;border-radius:3px 0 0 3px}
.devrow .pct{width:56px;flex:none;text-align:right;font-family:var(--font-mono)}
@media (max-width:700px){
  .drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;height:82vh;border-radius:20px 20px 0 0;transform:translateY(100%);animation:sheetin .28s cubic-bezier(.32,.72,0,1) forwards}
  @keyframes sheetin{to{transform:translateY(0)}}
  .field-row{grid-template-columns:1fr}
}

/* Season entry grid (mockup §6.5) */
.sgrid table{min-width:1080px}
.sgrid td{padding:3px 4px}
.sgrid input{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--text)}
.sgrid input:hover{border-color:var(--border)}
.sgrid input:focus{outline:none;border-color:var(--accent);background:#fff}
.sgrid input.derived{color:var(--text3);background:var(--bg2);border-color:transparent}
.stickyc{position:sticky;left:0;background:#fff;z-index:1}
thead .stickyc{background:var(--card)}
.bal{width:9px;height:9px;border-radius:50%;display:inline-block}
.bal-ok{background:var(--green)}.bal-off{background:var(--red)}.bal-res{background:var(--amber)}.bal-na{background:var(--border2)}
.carr{display:block;font-size:9px;color:var(--text3);margin-top:1px}
.carr.st{color:var(--accent)}
.alert{display:flex;gap:8px;padding:9px 11px;border-radius:8px;font-size:12px;align-items:flex-start;line-height:1.35}
.alert b{font-weight:600}
.alert-ok{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.alert-warn{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)}
.alert-fail{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.note{font-size:12px;color:var(--text3);background:var(--bg2);border-radius:8px;padding:9px 11px}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--text3);display:block;margin-bottom:4px}

/* Data Health issues (mockup §6.12) */
.issue{display:flex;gap:11px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--border)}
.issue:last-child{border-bottom:none}
.issue .ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.issue .t{font-size:13px;font-weight:500;color:var(--text)}
.issue .d{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.45}
.issue .act{flex-shrink:0;align-self:center}
.st-red{color:var(--red)}.st-red .section-title-bar{background:var(--red)}
.st-amber{color:var(--amber)}.st-amber .section-title-bar{background:var(--amber)}

/* Bulk Import (mockup §6.6) */
.steps{display:flex;gap:0;margin-bottom:14px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;padding:6px 16px 6px 10px;font-size:12px;color:var(--text3)}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--bg3);color:var(--text3);font-size:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.step.done{color:var(--text2)}.step.done .n{background:var(--green);color:#fff}
.step.cur{color:var(--text);font-weight:500}.step.cur .n{background:var(--accent);color:#fff}
.drop{border:2px dashed var(--border2);border-radius:var(--r2);padding:26px;text-align:center;background:#fff;transition:.15s}
.drop.over{border-color:var(--accent);background:var(--bg2)}
.drop .big{font-family:var(--font-display);font-size:17px;margin-bottom:4px}
.maprow{display:grid;grid-template-columns:1fr 22px 1fr 30px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.maprow:last-child{border-bottom:none}
.srccol{font-family:var(--font-mono);font-size:12px;color:var(--text);unicode-bidi:plaintext}
.arrow{color:var(--text3);text-align:center}

/* Farm Map (§6.13) */
.mapwrap{position:relative;height:calc(100vh - 92px);min-height:420px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--border)}
#farmmap{width:100%;height:100%}
.leaflet-container{background:#0e1a1a;font-family:var(--font-body)}
.mapctl{position:absolute;top:10px;right:10px;z-index:500;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:210px}
.mapctl .form-label{margin-top:6px}
.mapctl select{width:100%;font-size:12px;padding:4px 6px;border:1px solid var(--border2);border-radius:5px;background:#fff;color:var(--text)}
.bmw{display:flex;gap:3px;margin-top:5px}
.bmw button{flex:1;font-size:10px;padding:4px 2px;border:1px solid var(--border2);background:#fff;color:var(--text2);border-radius:5px}
.bmw button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.maplegend{margin-top:8px;max-height:180px;overflow-y:auto}
.maplegend .lgi{display:flex;align-items:center;gap:6px;font-size:11px;padding:1px 0}
.maplegend .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.mapcov{position:absolute;bottom:10px;left:10px;z-index:500;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;font-size:11px;color:var(--text2);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.maphover{position:absolute;z-index:500;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:9px 11px;font-size:12px;box-shadow:0 3px 14px rgba(0,0,0,.18);max-width:240px;pointer-events:none}
/* ── Farm Map: sidebar sub-panel ── */
.navsub{margin:2px 6px 4px;padding:8px 6px 4px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.navsub .sl{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--sidebar-muted);padding:8px 4px 4px}
.navsub .sl:first-child{padding-top:0}
.navsub .ni{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;font-size:12px;color:var(--sidebar-text);cursor:pointer}
.navsub .ni:hover{background:rgba(255,255,255,.05)}
.navsub .ni.on{background:var(--accent);color:#fff}
.navsub .ni.off{opacity:.4}
.navsub .ni .c{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;opacity:.7}
.navsub .ni .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.navsub .navshow{font-size:10.5px;color:var(--sidebar-muted);padding:6px 4px 2px}
.navsub .yrleg .bar{height:9px;border-radius:4px;background:linear-gradient(90deg,#eef2ea,#a6c9a8,#4f9670,#1e6b3a)}
.navsub .yrleg .ends{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--sidebar-muted);margin-top:3px}
/* ── Farm Map: two-column layout, map overlays, right panel ── */
.mapgrid{display:grid;grid-template-columns:1fr 320px;gap:10px;height:calc(100vh - 92px);min-height:440px}
.mapgrid .mapwrap{height:100%}
.mpanel{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.bmsw{position:absolute;top:10px;right:10px;z-index:500;display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.bmsw button{font-size:11px;padding:4px 9px;border:none;background:none;color:var(--text2);border-radius:5px;cursor:pointer}
.bmsw button.on{background:var(--accent);color:#fff}
.mact{position:absolute;bottom:10px;left:10px;z-index:500;display:flex;gap:6px}
.lbl-div{font-size:10px;font-family:var(--font-mono);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.7);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;font-weight:500}
.hc{position:absolute;z-index:550;width:240px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);box-shadow:0 4px 18px rgba(0,0,0,.22);padding:10px 12px;pointer-events:none;font-size:12px}
.hc .hc-h{display:flex;align-items:baseline;gap:6px}
.hc .hc-h b{font-family:var(--font-mono);font-size:13px}
.hc .hc-h .a{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text2)}
.hc .hc-v{font-size:11.5px;color:var(--text2);margin:2px 0 6px}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px}
.spark i{flex:1;background:var(--accent);border-radius:1px;min-height:2px}
.hc-m{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text3);margin-top:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px}
.kv .k{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text3)}
.kv .v{font-size:13px;color:var(--text);margin-top:1px}
.kv .v.m{font-family:var(--font-mono)}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;padding:8px 10px;border-radius:var(--r);line-height:1.4}
.alert-warn{background:rgba(224,138,30,.1);border:1px solid rgba(224,138,30,.35);color:var(--text2)}
.plh{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.plh.on{background:var(--bg2);border-color:var(--border)}
.plh.past{opacity:.72}
.plh .sw2{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.plh.past .sw2{background:var(--border2)}
.plh .nm{font-size:12.5px;font-weight:500}
.plh .sub{font-size:10.5px;color:var(--text3)}
.plh .tot{margin-left:auto;text-align:right}
.plh .tot b{font-family:var(--font-mono);font-size:13px}
.plh .tot .u{display:block;font-size:9px;color:var(--text3)}
.yearbars{display:flex;align-items:flex-end;gap:4px}
.yearbars .yb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.yearbars .yb .bar{width:70%;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.yearbars .yb .yl{font-size:9px;color:var(--text3);font-family:var(--font-mono);margin-top:3px}
.yearbars .yb .yv{font-size:8px;color:var(--text2);font-family:var(--font-mono);line-height:1;margin-bottom:2px;white-space:nowrap}
@media(max-width:900px){.mapgrid{grid-template-columns:1fr;height:auto}.mapgrid .mapwrap{height:60vh}}

/* Mobile */
.sidebar-overlay{display:none}
.bottom-nav{display:none}
@media (max-width:1024px){
  :root{--sidebar-w:190px}
  .kpi-grid,.grid3{grid-template-columns:repeat(2,1fr)}
  .kpi-val{font-size:22px}
}
@media (max-width:767px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .menu-btn{display:inline-flex}
  .page{padding:14px;padding-bottom:70px}
  .kpi-grid,.grid2,.grid3{grid-template-columns:1fr}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--sidebar);z-index:30;overflow-x:auto}
  .bn-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 15px;color:var(--sidebar-muted);background:none;border:none;font-size:10px}
  .bn-item svg{width:18px;height:18px}
  .bn-item.active{color:#fff}
}

<script>
"use strict";
var ce = React.createElement, useState = React.useState, useEffect = React.useEffect;

/* ── Supabase: shared DalOS client. No storageKey override → shares the default
   `sb-<ref>-auth-token` with Vision/Analytics/Workspace on the one Pages origin,
   which is how SSO works across the family. Do not add an idle timer that signs
   out (that caused the family-wide random sign-outs). ── */
var DALOS_SUPABASE_URL = 'https://sfyjvgjwvtwkrnqrvqyc.supabase.co';
var DALOS_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeWp2Z2p3dnR3a3JucXJ2cXljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NzIxNjYsImV4cCI6MjA5MDQ0ODE2Nn0.FjA75XZsp0Kx5Xam_rrnYoAHX4JHKey6vEFCH_zlMuQ';
var supabase = window.supabase.createClient(DALOS_SUPABASE_URL, DALOS_ANON_KEY);
var BUILD = 'v0.7.0 (2026.08.12)';

/* ── Nav model. Screens are scaffolds in this shell; each maps to a PRD phase. ── */
function icon(paths){ return function(){ return ce('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, paths.map(function(d,i){return ce('path',{key:i,d:d});})); }; }
var IC = {
  structure: icon(['M3 3h7v7H3z','M14 3h7v7h-7z','M14 14h7v7h-7z','M3 14h7v7H3z']),
  register:  icon(['M3 4h18','M3 10h18','M3 16h18','M3 22h18']),
  map:       icon(['M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3z','M9 3v15','M15 6v15']),

  recon:     icon(['M3 6h18','M3 12h12','M3 18h7','M18 5v6','M15 8h6']),
  health:    icon(['M12 2l9 4v6c0 5-3.8 9.3-9 10-5.2-.7-9-5-9-10V6z','M9 12l2 2 4-4']),
  reference: icon(['M4 5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z','M9 7h7','M9 11h7']),
  heatmap:   icon(['M3 3h7v7H3z','M14 3h7v7h-7z','M3 14h7v7H3z','M14 14h7v7h-7z']),

};
/* Nav mirrors the agreed mockup: Explore / Manage, with post-v1 screens badged v2. */
var NAV = [
  {sec:'Explore', items:[
    {k:'structure', label:'Structure',        Icon:IC.structure, phase:'P2'},
    {k:'register',  label:'Block Register',    Icon:IC.register,  phase:'P2'},
    {k:'history',   label:'Production History', Icon:IC.history,  phase:'P5'},
    {k:'heatmap',   label:'Yield Heatmap',     Icon:IC.heatmap,  phase:'L1'},
    {k:'bench',     label:'Benchmark',         Icon:IC.bench,    phase:'L2'},
    {k:'map',       label:'Farm Map',          Icon:IC.map,       phase:'P6'} ]},
  {sec:'Manage', items:[
    {k:'entry',     label:'Season Entry',       Icon:IC.entry,    phase:'P3'},
    {k:'import',    label:'Bulk Import',        Icon:IC.import,   phase:'P4'},
    {k:'recon',     label:'Reconciliation',     Icon:IC.recon,    phase:'P7', need:'read'},
    {k:'health',    label:'Data Health',        Icon:IC.health,   phase:'P7'},

];
function navItem(k){ for(var s=0;s<NAV.length;s++){ var it=NAV[s].items.filter(function(i){return i.k===k;})[0]; if(it) return it; } return NAV[0].items[0]; }

/* ── Reusable runtime states (§11c) ── */
function Loading(p){ var n=(p&&p.rows)||6; var a=[]; for(var i=0;i<n;i++) a.push(ce('div',{key:i,className:'skel',style:{margin:'9px 0',width:(60+((i*17)%38))+'%'}})); return ce('div',{className:'card'},a); }
function EmptyState(p){ return ce('div',{className:'state'},
  ce('div',{className:'state-title'}, p.title||'Nothing here yet'),
  ce('div',{className:'state-msg'}, p.msg||''),
  p.action ? ce('button',{className:'btn btn-secondary btn-sm',onClick:p.onAction}, p.action) : null ); }
function ErrorState(p){ return ce('div',{className:'state'},
  ce('div',{className:'state-title state-err'}, 'Something went wrong'),
  ce('div',{className:'state-msg'}, p.msg||'Unexpected error.'),
  ce('button',{className:'btn btn-secondary btn-sm',onClick:p.onRetry}, 'Retry') ); }

/* ── Screen scaffold: honest "phase" empty state, never a fake zero (§11c) ── */
function Scaffold(p){ return ce('div',null,
  ce('div',{className:'section-title'}, ce('span',{className:'section-title-bar'}), p.title),
  ce('div',{className:'card'}, ce(EmptyState,{
    title: p.title+' — arriving in '+p.phase,
    msg: p.msg })) ); }

var SCREENS = {
  structure:{title:'Structure', body:function(ctx){ return ce(StructureScreen, ctx); }},
  register: {title:'Block Register', body:function(ctx){ return ce(RegisterScreen, ctx); }},
  map:      {title:'Farm Map', body:function(ctx){ return ce(FarmMapScreen, ctx); }},
  history:  {title:'Production History', body:function(ctx){ return ce(ProductionHistoryScreen, ctx); }},
  heatmap:  {title:'Yield Heatmap', body:function(ctx){ return ce(HeatmapScreen, ctx); }},
  bench:    {title:'Benchmark', body:function(ctx){ return ce(BenchmarkScreen, ctx); }},
  entry:    {title:'Season Entry', body:function(ctx){ return ce(SeasonEntryScreen, ctx); }},
  import:   {title:'Bulk Import', body:function(ctx){ return ce(BulkImportScreen, ctx); }},
  recon:    {title:'Reconciliation', body:function(ctx){ return ce(ReconciliationScreen, ctx); }},
  health:   {title:'Data Health', body:function(ctx){ return ce(DataHealthScreen, ctx); }},
  reference:{title:'Reference Data', body:function(ctx){ return ce(ReferenceDataScreen, ctx); }}
};

/* ── Squarified treemap layout (Bruls et al.) — ~50 lines, hand-rolled (§11d) ── */
function squarify(items, x0, y0, w0, h0){
  var out=[]; var nodes=items.filter(function(d){return d.value>0;}).slice().sort(function(a,b){return b.value-a.value;});
  var total=nodes.reduce(function(a,d){return a+d.value;},0); if(total<=0) return out;
  var x=x0,y=y0,w=w0,h=h0; var scale=(w0*h0)/total;
  var areas=nodes.map(function(d){return {d:d,a:d.value*scale};});
  function worst(row,side){ var s=row.reduce(function(a,r){return a+r.a;},0); var mx=Math.max.apply(null,row.map(function(r){return r.a;})); var mn=Math.min.apply(null,row.map(function(r){return r.a;})); return Math.max(side*side*mx/(s*s),(s*s)/(side*side*mn)); }
  var i=0;
  while(i<areas.length){
    var side=Math.min(w,h); var row=[areas[i]]; var j=i+1;
    while(j<areas.length){ if(worst(row.concat([areas[j]]),side)<=worst(row,side)){ row.push(areas[j]); j++; } else break; }
    var sum=row.reduce(function(a,r){return a+r.a;},0); var thick=sum/side;
    if(w<h){ var ox=x; row.forEach(function(r){ var rw=r.a/thick; out.push(Object.assign({},r.d,{x:ox,y:y,w:rw,h:thick})); ox+=rw; }); y+=thick; h-=thick; }
    else   { var oy=y; row.forEach(function(r){ var rh=r.a/thick; out.push(Object.assign({},r.d,{x:x,y:oy,w:thick,h:rh})); oy+=rh; }); x+=thick; w-=thick; }
    i=j;
  }
  return out;
}

/* ── Structure (§6.1) — area-proportional treemap, Farm→Sector→Plot→Block ── */
function StructureScreen(ctx){
  var s=useState({loading:true,err:null,blocks:[]}); var st=s[0],set=s[1];
  var pth=useState([]); var path=pth[0],setPath=pth[1];
  var d=useState(null); var sel=d[0],setSel=d[1];
  useEffect(function(){ setPath([]); load(); },[ctx.crop]);
  function load(){
    set({loading:true,err:null,blocks:[]});
    var q=supabase.from('farm_blocks').select('id,operational_block_id,aydi_block_number,farm_code,sector_code,plot_code,planting_year,total_area_fed,planted_area_fed,aerobotics_area_ha,jde_cost_center_id,rootstock_id,lifecycle,product_id,farms(name),varieties(name),farm_rootstocks(name)').limit(1000);
    if(ctx.crop!=='all') q=q.eq('product_id',ctx.crop);
    q.then(function(r){ if(r.error) set({loading:false,err:r.error.message,blocks:[]}); else set({loading:false,err:null,blocks:r.data||[]}); });
  }
  if(st.loading) return ce('div',null, ce('div',{className:'kpi-grid'},[0,1,2,3].map(function(i){return ce('div',{key:i,className:'kpi'}, ce('div',{className:'skel',style:{width:'60%'}}), ce('div',{className:'skel',style:{width:'40%',height:22,marginTop:8}}));})), ce('div',{className:'skel',style:{height:400,marginTop:12}}));
  if(st.err) return ce(ErrorState,{msg:st.err,onRetry:load});

  // filter blocks to current drill scope
  var scope=st.blocks.filter(function(b){
    if(path.length>=1 && b.farm_code!==path[0].k) return false;
    if(path.length>=2 && b.sector_code!==path[1].k) return false;
    if(path.length>=3 && b.plot_code!==path[2].k) return false;
    return true;
  });
  var totalArea=scope.reduce(function(a,b){return a+Number(b.total_area_fed||0);},0);
  var farms=new Set(scope.map(function(b){return b.farm_code;}));
  var years=scope.map(function(b){return b.planting_year;}).filter(Boolean).sort(function(a,b){return a-b;});
  var medYear=years.length?years[Math.floor(years.length/2)]:null;

  // build tiles at current level
  var level=path.length; var tiles;
  function dominantCrop(list){ var c={}; list.forEach(function(b){c[b.product_id]=(c[b.product_id]||0)+1;}); return Object.keys(c).sort(function(a,b){return c[b]-c[a];})[0]; }
  if(level<3){
    var keyF = level===0?function(b){return b.farm_code;} : level===1?function(b){return b.sector_code;} : function(b){return b.plot_code;};
    var labF = level===0?function(b){return (b.farms&&b.farms.name)||b.farm_code;} : level===1?function(b){return 'S'+b.sector_code;} : function(b){return 'P'+b.plot_code;};
    var groups={};
    scope.forEach(function(b){ var k=keyF(b); (groups[k]=groups[k]||{k:k,label:labF(b),list:[]}).list.push(b); });
    tiles=Object.keys(groups).map(function(k){ var g=groups[k]; return {k:k,label:g.label,value:g.list.reduce(function(a,b){return a+Number(b.total_area_fed||0);},0),count:g.list.length,crop:dominantCrop(g.list),leaf:false}; });
  } else {
    tiles=scope.map(function(b){ return {k:b.operational_block_id,label:b.aydi_block_number,value:Number(b.total_area_fed||0),crop:b.product_id,leaf:true,block:b}; });
  }
  var W=1000,H=Math.max(320,Math.min(560, tiles.length>60?560:420));
  var laid=squarify(tiles.map(function(t){return {value:t.value,t:t};}), 0,0,W,H).map(function(r){return Object.assign({},r.t,{x:r.x,y:r.y,w:r.w,h:r.h});});

  function onTile(t){ if(t.leaf) setSel(t.block); else setPath(path.concat([{k:t.k,label:t.label}])); }
  var crumbs=[{label:(ctx.crop==='all'?'All crops':ctx.crop),i:-1}].concat(path.map(function(p,i){return {label:p.label,i:i};}));

  var kpi=function(label,val,sub,color){ return ce('div',{className:'kpi'}, ce('div',{className:'kpi-label'},label), ce('div',{className:'kpi-val',style:color?{color:color}:null},val), ce('div',{className:'kpi-sub'},sub)); };
  var cropName=function(id){ return id?id.charAt(0).toUpperCase()+id.slice(1):id; };

  // ── Bearing / Unresolved KPIs ──
  // Bearing area = each plot's current cultivated area (planted_area_fed = المساحة المنزرعة),
  // net of borders and <= booked total_area_fed. Retired plots carry 0. Historical bearing
  // area by year lives in the season data.
  var bearArea=scope.reduce(function(a,b){return a+Number(b.planted_area_fed||0);},0);
  var bearPct=totalArea>0?Math.round(bearArea/totalArea*1000)/10:0;
  var ccMiss=scope.filter(function(b){return isActive(b.lifecycle)&&!b.jde_cost_center_id;}).length;
  var rsMiss=scope.filter(function(b){return isActive(b.lifecycle)&&!b.rootstock_id;}).length;
  var issues=scope.filter(function(b){return isActive(b.lifecycle)&&(!b.jde_cost_center_id||!b.rootstock_id);}).length;

  // ── Crop mix (planted area share) ──
  var mix={}; scope.forEach(function(b){ mix[b.product_id]=(mix[b.product_id]||0)+Number(b.total_area_fed||0); });
  var mixTot=Object.keys(mix).reduce(function(a,k){return a+mix[k];},0)||1;
  var mixKeys=Object.keys(mix).sort(function(a,b){return mix[b]-mix[a];});

  // ── Planting-age profile (3-year buckets) ──
  var buck={}; scope.forEach(function(b){ if(!b.planting_year) return; var d=Math.floor(b.planting_year/3)*3; buck[d]=(buck[d]||0)+1; });
  var buckKeys=Object.keys(buck).sort(); var buckMax=buckKeys.reduce(function(m,k){return Math.max(m,buck[k]);},1);

  var mixPanel=ce('div',{className:'card'},
    ce('div',{className:'section-title'},ce('span',{className:'section-title-bar'}),'Crop mix'),
    mixKeys.length?mixKeys.map(function(c){ var v=mix[c];
      return ce('div',{key:c,style:{marginBottom:8}},
        ce('div',{style:{display:'flex',fontSize:12,marginBottom:3}}, ce('span',null,cropName(c)),
          ce('span',{style:{marginLeft:'auto',fontFamily:'var(--font-mono)',color:'var(--text3)'}}, fmt(Math.round(v))+' fed · '+Math.round(v/mixTot*100)+'%')),
        ce('div',{style:{height:7,background:'var(--bg2)',borderRadius:4,overflow:'hidden'}},
          ce('div',{style:{height:'100%',width:(v/mixTot*100)+'%',background:CROP_COLORS[c]||'#888',borderRadius:4}})));
    }):ce('div',{style:{fontSize:12,color:'var(--text3)'}},'No blocks in scope.'));

  var agePanel=ce('div',{className:'card'},
    ce('div',{className:'section-title'},ce('span',{className:'section-title-bar'}),'Planting age profile'),
    ce('div',{style:{display:'flex',alignItems:'flex-end',gap:5,height:88}},
      buckKeys.length?buckKeys.map(function(k){
        return ce('div',{key:k,title:buck[k]+' blocks planted '+k+'–'+(Number(k)+2),style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%'}},
          ce('div',{style:{fontSize:9,color:'var(--text2)',fontFamily:'var(--font-mono)',marginBottom:2}}, buck[k]),
          ce('div',{style:{width:'70%',height:Math.max(2,Math.round(buck[k]/buckMax*66))+'px',background:'var(--accent)',borderRadius:'3px 3px 0 0'}}),
          ce('div',{style:{fontSize:10,color:'var(--text3)',marginTop:4,fontFamily:'var(--font-mono)'}}, "'"+String(k).slice(2)));
      }):ce('div',{style:{fontSize:12,color:'var(--text3)'}},'No planting years recorded.')),
    ce('div',{style:{fontSize:11,color:'var(--text3)',marginTop:6}},'Blocks by planting year (3-yr buckets).'));

  var bview=scope.slice(0,72);
  var blocksInView=ce('div',{className:'card'},
    ce('div',{className:'section-title'},ce('span',{className:'section-title-bar'}),'Blocks in view ',ce('span',{style:{color:'var(--text3)',fontWeight:400,textTransform:'none',letterSpacing:0}}, '— '+scope.length+(scope.length===1?' block':' blocks'))),
    ce('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:8}},
      bview.map(function(b){
        return ce('div',{key:b.id,onClick:function(){setSel(b);},style:{cursor:'pointer',padding:'8px 10px',background:'var(--bg2)',borderRadius:6,borderLeft:'3px solid '+(CROP_COLORS[b.product_id]||'#888')}},
          ce('div',{style:{fontFamily:'var(--font-mono)',fontSize:12,fontWeight:600}}, b.aydi_block_number||b.operational_block_id),
          ce('div',{style:{fontSize:12,color:'var(--text2)',margin:'2px 0'}}, (b.varieties&&b.varieties.name)||'—'),
          ce('div',{style:{fontSize:11,color:'var(--text3)',fontFamily:'var(--font-mono)'}}, fmt(b.total_area_fed)+' fed · '+(b.planting_year||'—')));
      }),
      scope.length>72?ce('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:11,padding:'8px 10px',background:'var(--bg2)',borderRadius:6}}, '+'+(scope.length-72)+' more'):null));

  return ce('div',null,
    ce('div',{className:'kpi-grid'},
      kpi('Blocks', scope.length, level>0?'in scope':(ctx.crop==='all'?'all crops':ctx.crop)),
      kpi('Total area', fmt(Math.round(totalArea)), 'fed booked · '+farms.size+' farm'+(farms.size===1?'':'s')),
      kpi('Bearing area', fmt(Math.round(bearArea)), bearPct+'% of total · cultivated'),
      kpi('Unresolved issues', issues, issues?(ccMiss+' missing cost centre · '+rsMiss+' missing rootstock'):'clean', issues?'var(--red)':null)
    ),
    ce('div',{style:{display:'flex',alignItems:'center',gap:6,fontSize:13,margin:'2px 0 10px',flexWrap:'wrap'}},
      crumbs.map(function(c,idx){ return ce('span',{key:idx,style:{display:'inline-flex',alignItems:'center',gap:6}},
        idx>0?ce('span',{style:{color:'var(--text3)'}},'›'):null,
        ce('button',{className:'side-link',style:{color:idx===crumbs.length-1?'var(--text)':'var(--accent)',padding:0,fontSize:13},onClick:function(){ setPath(path.slice(0,c.i+1)); }}, c.label));
      })),
    ce('div',{className:'grid2',style:{gridTemplateColumns:'1.55fr 1fr',marginBottom:10}},
      ce('div',{className:'card',style:{padding:6}},
        ce('svg',{viewBox:'0 0 '+W+' '+H,style:{width:'100%',display:'block'},preserveAspectRatio:'none'},
          laid.map(function(t){
            var col=CROP_COLORS[t.crop]||'#888'; var showLabel=t.w>78&&t.h>30;
            return ce('g',{key:t.k,style:{cursor:'pointer'},onClick:function(){onTile(t);}},
              ce('rect',{x:t.x+1,y:t.y+1,width:Math.max(0,t.w-2),height:Math.max(0,t.h-2),rx:3,fill:col,fillOpacity:t.leaf?0.82:0.9,stroke:'#fff',strokeWidth:1}),
              showLabel?ce('text',{x:t.x+7,y:t.y+16,style:{fill:'#fff',fontSize:t.leaf?11:13,fontFamily:t.leaf?'var(--font-mono)':'var(--font-body)',fontWeight:500,pointerEvents:'none'}}, t.label):null,
              (showLabel&&!t.leaf)?ce('text',{x:t.x+7,y:t.y+31,style:{fill:'rgba(255,255,255,.85)',fontSize:10,pointerEvents:'none'}}, t.count+' blk · '+fmt(Math.round(t.value))+' fed'):null
            );
          })),
        ce('div',{style:{fontSize:11,color:'var(--text3)',marginTop:8,padding:'0 4px'}}, level<3?'Tile area = feddan. Click to drill Farm › Sector › Plot › Block. Colour = crop.':'Click a block to open its detail.')),
      ce('div',{style:{display:'flex',flexDirection:'column',gap:10}}, mixPanel, agePanel)),
    blocksInView,
    sel?ce(BlockDetail,{block:sel,ctx:ctx,onChanged:function(){ setSel(null); load(); },onClose:function(){setSel(null);}}):null
  );
}

/* ── Block Register (§6.2) — server-paged, searchable, quick-filter chips ── */
var PAGE = 50;
var CROP_COLORS = { citrus:'#e08a1e', grapes:'#6a3d9a', mango:'#d94f2a', pomegranate:'#b03060', olives:'#5a6b2a', berries:'#2a5a8a' };
var ACTIVE_LC = ['bearing','pre_bearing','planned'];   // a cost centre is only expected on active blocks
function isActive(lc){ return ACTIVE_LC.indexOf(lc)>=0; }
function fmt(n){ return n==null ? '—' : Number(n).toLocaleString(undefined,{maximumFractionDigits:2}); }

function RegisterScreen(ctx){
  var s=useState({loading:true,err:null,rows:[],total:0}); var st=s[0],set=s[1];
  var p=useState(0); var page=p[0],setPage=p[1];
  var q=useState(''); var search=q[0],setSearch=q[1];
  var c=useState(null); var chip=c[0],setChip=c[1];
  var f=useState(''); var farmF=f[0],setFarmF=f[1];
  var d=useState(null); var sel=d[0],setSel=d[1];
  var k=useState({}); var counts=k[0],setCounts=k[1];
  var fl=useState([]); var farms=fl[0],setFarms=fl[1];
  var pm=useState({}); var prodMap=pm[0],setProdMap=pm[1];   // block_id -> {y:last prod year, t:tonnes}
  var cs=useState({}); var chainSet=cs[0],setChainSet=cs[1];  // block_ids that belong to a replant lineage
  var nb=useState(false); var newOpen=nb[0],setNewOpen=nb[1];

  useEffect(function(){ setPage(0); }, [ctx.crop, search, chip, farmF]);
  useEffect(function(){ load(); }, [ctx.crop, page, search, chip, farmF, chainSet]);
  useEffect(function(){ loadMeta(); }, [ctx.crop]);

  function base(){
    var sel='id,operational_block_id,aydi_block_number,product_id,farm_code,sector_code,plot_code,planting_year,total_area_fed,planted_area_fed,aerobotics_area_ha,jde_cost_center_id,rootstock_id,lifecycle,last_producing_season,farms(name),varieties(name),farm_rootstocks(name)';
    var query=supabase.from('farm_blocks').select(sel,{count:'exact'});
    if(ctx.crop!=='all') query=query.eq('product_id',ctx.crop);
    if(farmF) query=query.eq('farm_code',farmF);
    if(search.trim()){ var t='%'+search.trim()+'%'; query=query.or('operational_block_id.ilike.'+t+',aydi_block_number.ilike.'+t); }
    if(chip==='retired'){ query=query.eq('lifecycle','retired'); }
    else if(chip==='replanted'){ var rids=Object.keys(chainSet); query=query.in('id', rids.length?rids:['00000000-0000-0000-0000-000000000000']); }  // both predecessor + successor, incl retired
    else {
      query=query.neq('lifecycle','retired');                              // retired live in their own list
      if(chip==='no_cc') query=query.is('jde_cost_center_id',null).in('lifecycle',ACTIVE_LC);
      if(chip==='no_aero') query=query.is('aerobotics_area_ha',null);
      if(chip==='no_root') query=query.is('rootstock_id',null);
    }
    return query;
  }
  function load(){
    set(function(x){return Object.assign({},x,{loading:true,err:null});});
    base().order('operational_block_id').range(page*PAGE,page*PAGE+PAGE-1).then(function(r){
      if(r.error){ set({loading:false,err:r.error.message,rows:[],total:0}); return; }
      set({loading:false,err:null,rows:r.data||[],total:r.count||0});
    });
  }
  function loadMeta(){
    var cropEq=function(qq){ return ctx.crop==='all'?qq:qq.eq('product_id',ctx.crop); };
    Promise.all([
      cropEq(supabase.from('farm_blocks').select('id',{count:'exact',head:true})).neq('lifecycle','retired'),
      cropEq(supabase.from('farm_blocks').select('id',{count:'exact',head:true})).is('jde_cost_center_id',null).in('lifecycle',ACTIVE_LC),
      cropEq(supabase.from('farm_blocks').select('id',{count:'exact',head:true})).is('aerobotics_area_ha',null).neq('lifecycle','retired'),
      cropEq(supabase.from('farm_blocks').select('id',{count:'exact',head:true})).is('rootstock_id',null).neq('lifecycle','retired'),
      cropEq(supabase.from('farm_blocks').select('id',{count:'exact',head:true})).eq('lifecycle','retired')
    ]).then(function(r){ setCounts(function(c){ return Object.assign({},c,{all:r[0].count||0,no_cc:r[1].count||0,no_aero:r[2].count||0,no_root:r[3].count||0,retired:r[4].count||0}); }); });
    supabase.from('farm_blocks').select('farm_code,farms(name)').then(function(r){
      var seen={}; (r.data||[]).forEach(function(x){ if(x.farm_code&&!seen[x.farm_code]) seen[x.farm_code]=(x.farms&&x.farms.name)||x.farm_code; });
      setFarms(Object.keys(seen).sort().map(function(fc){return {code:fc,name:seen[fc]};}));
    });
    // last (non-zero) production per block for the "Last prod" column
    var pq=supabase.from('v_farm_block_current').select('id,latest_prod_year,latest_prod_t').limit(1000);
    if(ctx.crop!=='all') pq=pq.eq('product_id',ctx.crop);
    pq.then(function(r){ if(r.error||!r.data) return; var m={}; r.data.forEach(function(x){ if(x.latest_prod_t!=null) m[x.id]={y:x.latest_prod_year,t:Number(x.latest_prod_t)}; }); setProdMap(m); });
    // "↻ replanted" badge: (a) a land (product/farm/sector/plot) holding BOTH a retired
    // predecessor and a current planting, OR (b) any block on a recorded farm_block_lineage
    // edge — the latter catches IN-PROGRESS replants where the old planting is still bearing
    // and the successor is only planned (e.g. SA 00-06A: Prime '13 → Sweet Celebration '26).
    supabase.from('farm_blocks').select('id,product_id,farm_code,sector_code,plot_code,lifecycle').then(function(r){
      if(r.error||!r.data) return; var byLand={};
      r.data.forEach(function(x){ var k=x.product_id+'|'+x.farm_code+'|'+x.sector_code+'|'+x.plot_code; var o=byLand[k]=byLand[k]||{ids:[],ret:0,cur:0}; o.ids.push(x.id); if(x.lifecycle==='retired')o.ret++; else o.cur++; });
      var s={}; Object.keys(byLand).forEach(function(k){ var o=byLand[k]; if(o.ret>0&&o.cur>0) o.ids.forEach(function(id){s[id]=1;}); });
      supabase.from('farm_block_lineage').select('parent_block_id,child_block_id').then(function(lr){
        if(lr.data) lr.data.forEach(function(e){ if(e.parent_block_id)s[e.parent_block_id]=1; if(e.child_block_id)s[e.child_block_id]=1; });
        setChainSet(s);
        var rids=Object.keys(s); var cq=supabase.from('farm_blocks').select('id',{count:'exact',head:true}).in('id', rids.length?rids:['00000000-0000-0000-0000-000000000000']);
        if(ctx.crop!=='all') cq=cq.eq('product_id',ctx.crop);
        cq.then(function(cr){ setCounts(function(c){ return Object.assign({},c,{replanted:cr.count||0}); }); });
      }); });
  }

  var chips=[ {k:null,label:'Current',n:counts.all}, {k:'replanted',label:'↻ Replanted',n:counts.replanted},
              {k:'no_cc',label:'Missing cost centre',n:counts.no_cc},
              {k:'no_aero',label:'No Aerobotics',n:counts.no_aero}, {k:'no_root',label:'Rootstock blank',n:counts.no_root},
              {k:'retired',label:'↺ Retired',n:counts.retired} ];
  var pages=Math.max(1,Math.ceil(st.total/PAGE));

  return ce('div',null,
    ce('div',{className:'toolbar'},
      ce('input',{className:'search',placeholder:'Search block ID or Aydi…',value:search,onChange:function(e){setSearch(e.target.value);}}),
      ce('select',{className:'tb-select',value:farmF,onChange:function(e){setFarmF(e.target.value);}},
        ce('option',{value:''},'All farms'), farms.map(function(fm){return ce('option',{key:fm.code,value:fm.code}, fm.name);})),
      ce('button',{className:'btn btn-secondary btn-sm',onClick:function(){ exportCsv(base, prodMap); }},'Export CSV'),
      ctx.canWrite?ce('button',{className:'btn btn-primary btn-sm',style:{marginLeft:'auto'},onClick:function(){ setNewOpen(true); }},'+ New block'):null
    ),
    ce('div',{className:'toolbar'}, chips.map(function(ch){
      return ce('button',{key:ch.label,className:'chip'+(chip===ch.k?' active':''),onClick:function(){setChip(ch.k);}},
        ch.label, ce('span',{className:'cnt'}, ch.n==null?'…':ch.n));
    })),
    st.err ? ce(ErrorState,{msg:st.err,onRetry:load}) :
    st.loading ? ce(Loading,{rows:8}) :
    st.rows.length===0 ? ce('div',{className:'card'},ce(EmptyState,{title:'No blocks match',msg:(search||chip||farmF)?'Try clearing the search, chip, or farm filter.':'The register is empty for this crop.',action:(search||chip||farmF)?'Clear filters':null,onAction:function(){setSearch('');setChip(null);setFarmF('');}})) :
    ce('div',null,
      ce('div',{className:'table-wrap'},
        ce('table',null,
          ce('thead',null,ce('tr',null,['Block ID','Crop','Farm','Aydi','Variety','Rootstock','Planted','Total fed','Bearing fed','Last season','Aero ha','Cost ctr','Status'].map(function(h){return ce('th',{key:h},h);}))),
          ce('tbody',null, st.rows.map(function(b){
            return ce('tr',{key:b.id,className:'rowlink',onClick:function(){setSel(b);}},
              ce('td',null, ce('span',{className:'lot'}, b.operational_block_id)),
              ce('td',null, ce('span',{style:{display:'inline-block',width:8,height:8,borderRadius:2,background:CROP_COLORS[b.product_id]||'#999',marginRight:6}}), b.product_id),
              ce('td',null, (b.farms&&b.farms.name)||b.farm_code),
              ce('td',{className:'num'}, b.aydi_block_number),
              ce('td',{className:'ar',dir:'auto'}, (b.varieties&&b.varieties.name)||'—'),
              ce('td',{className:'ar',dir:'auto'}, (b.farm_rootstocks&&b.farm_rootstocks.name)||'—'),
              ce('td',{className:'num'}, b.planting_year),
              ce('td',{className:'num'}, fmt(b.total_area_fed)),
              ce('td',{className:'num'}, b.planted_area_fed==null?ce('span',{style:{color:'var(--text3)'}},'—'):fmt(b.planted_area_fed)),
              ce('td',{className:'num'},
                b.lifecycle==='bearing' ? ce('span',{style:{color:'var(--green)',fontWeight:600}},'On')
                : (b.last_producing_season!=null ? String(b.last_producing_season)
                : ce('span',{style:{color:'var(--text3)'}},'—'))),
              ce('td',{className:'num'}, b.aerobotics_area_ha==null?ce('span',{style:{color:'var(--text3)'}},'—'):fmt(b.aerobotics_area_ha)),
              ce('td',{className:'num',style:b.jde_cost_center_id?null:{color:'var(--amber)'}}, b.jde_cost_center_id||'—'),
              ce('td',null, ce('span',{style:{display:'inline-flex',alignItems:'center',gap:6,flexWrap:'wrap'}},
                ce('span',{className:'badge '+(b.lifecycle==='nursery'?'badge-warn':b.lifecycle==='bearing'?'badge-pass':'badge-neutral')}, b.lifecycle),

/* ── Production History (§6.4) — crop production by season, from the rollup ── */
var SEG = [
  {k:'export', label:'Export', color:'var(--accent)', codes:['export_carton','export_packhouse','export_total']},
  {k:'local',  label:'Local / farm-gate', color:'var(--accent2)', codes:['farm_gate_sales','local_sales_combined','raw_to_traders','field_reject_sales']},
  {k:'reject', label:'Reject / loss', color:'var(--amber)', codes:['packhouse_reject','weight_loss','weight_loss_damaged','shortage_dryout']}
];
// Map a stored-metrics object to the 4 Sankey leaves (export / packhouse reject /
// raw→traders / field-reject sales). Falls back across code variants per crop.
function sankeyParts(m){ m=m||{};
  return { exp:Number(m.export_total||m.export_packhouse||m.export_carton||0),
           rej:Number(m.packhouse_reject||0),
           trd:Number(m.raw_to_traders||m.local_sales_combined||0),
           fld:Number(m.field_reject_sales||m.farm_gate_sales||0) }; }
// Clean 3-column Sankey (§6.4) — Actual production → {To packhouse, Local branch}
// → {Export, Packhouse reject, Raw→traders, Field-reject sales}. The gap below the
// two branches is unaccounted loss. Filled bezier ribbons, ported from the mockup.
function sankeySVG(prod,exp,rej,trd,fld,W){
  prod=Number(prod)||0; W=W||520;
  if(prod<=0) return ce('div',{style:{fontSize:12,color:'var(--text3)',padding:'16px 0'}},'No production recorded.');
  var H=250,pad=16,x0=pad,x1=W*0.42,x2=W*0.78,barW=13,sc=(H-2*pad)/prod;
  var pk=exp+rej, local=trd+fld;
  var nProd={y:pad,h:prod*sc}, nPk={y:pad,h:pk*sc}, nLoc={y:pad+pk*sc+10,h:local*sc};
  var C={exp:'#0d6a68',rej:'#b87820',trd:'#159490',fld:'#7a7668'};
  var leaves=[{n:'Export',v:exp,c:C.exp},{n:'Packhouse reject',v:rej,c:C.rej},{n:'Raw → traders',v:trd,c:C.trd},{n:'Field-reject sales',v:fld,c:C.fld}];
  var ly=pad, lp=[]; leaves.forEach(function(l,i){ if(i===2) ly+=10; lp.push({n:l.n,v:l.v,c:l.c,y:ly,h:l.v*sc}); ly+=l.v*sc+6; });
  var K=0;

        var ll=e.layer.getLatLngs()[0], a=0; for(var i=0,j=ll.length-1;i<ll.length;j=i++){ a+=(ll[j].lng+ll[i].lng)*(ll[j].lat-ll[i].lat); }
        var ha=Math.abs(a/2)*(111320*111320*Math.cos(30.4*Math.PI/180))/1e4;

        if(ctx.canWrite){ var la=0,lo=0; ll.forEach(function(pt){la+=pt.lat;lo+=pt.lng;});
          setAssign({geojson:ringToGeoJSON(ll),centroid:{lat:la/ll.length,lng:lo/ll.length}}); }
        else e.layer.bindPopup('<b>Drawn polygon</b><br/>'+ha.toFixed(2)+' ha · '+(ha*2.38095).toFixed(2)+' fed<br/><span style="color:#6a7a79;font-size:11px">geom_source = manual · export to save/match</span>').openPopup();
      }); }
    }catch(e){}
    // true totals for Coverage (v_farm_block_geom only returns mapped blocks, so it can't see the gap)
    var cq=supabase.from('farm_blocks').select('farm_code,product_id').limit(2000);
    if(ctx.crop!=='all') cq=cq.eq('product_id',ctx.crop);
    cq.then(function(cr){ if(cr.error||!cr.data){ return; } var fs={},cs={}; cr.data.forEach(function(b){ fs[b.farm_code]=1; cs[b.product_id]=1; }); setCov({total:cr.data.length,farms:Object.keys(fs).length,crops:Object.keys(cs)}); });
    var q=supabase.from('v_farm_block_geom').select('*');
    if(ctx.crop!=='all') q=q.eq('product_id',ctx.crop);
    q.then(function(r){
      if(r.error){ set({loading:false,err:r.error.message,feats:[]}); return; }
      var rows=r.data||[]; var features=[];
      rows.forEach(function(row){ if(!row.geojson) return; try{ features.push({type:'Feature',geometry:JSON.parse(row.geojson),properties:row}); }catch(e){} });
      // A replanted plot has the retired predecessor AND the current block sharing one aydi/
      // outline. Render the CURRENT one so clicking the parcel selects the live planting
      // (and its allocated predecessor). Keep retired only where nothing current is mapped.
      var byKey={}; features.forEach(function(f){ var k=f.properties.farm_code+'|'+f.properties.aydi_block_number; (byKey[k]=byKey[k]||[]).push(f); });
      var deduped=[]; Object.keys(byKey).forEach(function(k){ var g=byKey[k]; var cur=g.filter(function(f){return f.properties.lifecycle!=='retired';}); deduped=deduped.concat(cur.length?cur:g); });
      featRef.current=deduped; set({loading:false,err:null,feats:rows}); buildLayer(true);

    // unpaginated reads at 1000 rows; v_farm_season_wide holds ~3.5k actual rows, so page it.
    (function(){ var mp={}; var PAGE=1000;
      function fin(){ Object.keys(mp).forEach(function(k){ mp[k].sort(function(a,b){return a[0]-b[0];}); }); seriesRef.current=mp; }
      function page(from){
        supabase.from('v_farm_season_wide').select('block_id,season_year,metrics').eq('scenario','actual').order('block_id',{ascending:true}).order('season_year',{ascending:true}).range(from,from+PAGE-1).then(function(sr){

      lr.data.forEach(function(e){ var pr=e.parent||{}; (mp[e.child_block_id]=mp[e.child_block_id]||[]).push({ pid:e.parent_block_id, event:e.event_type, variety:(pr.varieties&&pr.varieties.name)||'unknown', from:pr.planting_year, to:pr.last_producing_season }); });

  },[ctx.crop]);

function impNorm(s){ return String(s==null?'':s).normalize('NFC').replace(/['’`´]/g,'').replace(/\s+/g,' ').trim().replace(/\s*\d{1,2}$/,'').trim(); }

  if(s===''||s==='-'||s==='–'||s==='—'||/^#/.test(s)) return null; var n=parseFloat(s); return isFinite(n)?n:null; }

  // ---- step bodies ----
  var bodyStep;
  if(step===1||!file){
    bodyStep=ce('div',{className:'grid2'},
      ce('div',{className:'card'},
        ce('div',{className:'section-title'},ce('span',{className:'section-title-bar'}),'Source file'),
        ce('div',{className:'drop'+(over?' over':''),onDragOver:function(e){e.preventDefault();setOver(true);},onDragLeave:function(){setOver(false);},onDrop:function(e){e.preventDefault();setOver(false);onFile(e.dataTransfer.files[0]);}},
          ce('div',{className:'big'},'Drop an .xlsx or .csv here'),

          ce('label',{className:'btn btn-secondary btn-sm',style:{cursor:'pointer'}}, 'Choose file', ce('input',{type:'file',accept:'.xlsx,.xls,.csv',style:{display:'none'},onChange:function(e){onFile(e.target.files[0]);}}))),

    );
  } else if(step===2){

          ce('span',{className:'badge badge-warn'},(s.warn||0)+' warn'),ce('span',{className:'badge badge-fail'},(s.blocked||0)+' blocked'),

  }

/* ── Reference Data (§6.11) — Metrics / Rootstocks / Varieties admin ── */
var ROLE_BADGE={total:'badge-pass',aggregate:'badge-warn',residual:'badge-warn',plan:'badge-neutral',branch:'badge-neutral',child:'badge-neutral',other:'badge-neutral'};
function ReferenceDataScreen(ctx){

      if(ins.error){ setFlash({kind:'err',t:/duplicate|unique/i.test(ins.error.message)?(setRow.product_id+' '+ny+' '+setRow.scenario+' already exists.'):('Clone failed: '+ins.error.message)}); return; }

        ce('table',null,
          ce('thead',null,ce('tr',null,['Code','English','Arabic','Role','Parent','Aliases'].map(function(h){return ce('th',{key:h},h);}))),
          ce('tbody',null, d.metrics.map(function(m){return ce('tr',{key:m.code},
            ce('td',null,ce('span',{className:'lot'},m.code)),
            ce('td',null,m.name_en),
            ce('td',{className:'ar',dir:'auto'},m.name_ar||'—'),
            ce('td',null,ce('span',{className:'badge '+(ROLE_BADGE[m.role]||'badge-neutral'),style:{fontSize:10}},m.role)),
            ce('td',null,m.parent_code?ce('span',{className:'lot'},m.parent_code):'—'),

        )),
      ce('div',{className:'section-title'},ce('span',{className:'section-title-bar'}),'Metric sets ('+d.sets.length+') — clone for a new season'),
      ce('div',{className:'note',style:{marginBottom:10}},ce('b',null,'This is the architectural claim (AC4):'),' adding next season is cloning a set here — one row in ',ce('span',{className:'lot'},'farm_metric_sets'),' and its items. No code change, no migration, no deploy.'),

          ce('tbody',null, d.sets.map(function(s){return ce('tr',{key:s.id},
            ce('td',null,ce('span',null,ce('span',{style:{display:'inline-block',width:8,height:8,borderRadius:2,background:CROP_COLORS[s.product_id]||'#999',marginRight:6}}),s.product_id)),

      supabase.from('farm_metric_sets').select('id,notes,farm_metric_set_items(sort_order,required,farm_metrics(code,name_en,role))').eq('product_id',ctx.crop).eq('season_year',ctx.season).eq('scenario','actual').maybeSingle(),

/* ══════════ Yield Heatmap + Benchmark (v2 — pure UI on loaded season data) ══════════ */
function useYieldData(crop){
  var s=useState({loading:true,blocks:[],dim:{},rows:[]}); var d=s[0],set=s[1];
  useEffect(function(){ var cancel=false; set({loading:true,blocks:[],dim:{},rows:[]});
    var bq=supabase.from('farm_blocks').select('id,aydi_block_number,variety_code,rootstock_code,planting_year,lifecycle,last_producing_season,total_area_fed,product_id,farm_code,farms(name),varieties(name),farm_rootstocks(name)').limit(3000);
    if(crop!=='all') bq=bq.eq('product_id',crop);
    bq.then(function(br){ if(cancel)return; var blocks=br.data||[]; var dim={}; blocks.forEach(function(b){dim[b.id]=b;});
      var rows=[],PAGE=1000;
      function page(from){ supabase.from('v_farm_season_wide').select('block_id,season_year,bearing_area_fed,metrics').eq('scenario','actual').order('block_id').order('season_year').range(from,from+PAGE-1).then(function(sr){
        if(cancel)return; if(sr.error||!sr.data){ set({loading:false,blocks:blocks,dim:dim,rows:rows}); return; }
        sr.data.forEach(function(w){ if(dim[w.block_id]) rows.push(w); });

  },[crop]);

function HeatmapScreen(ctx){

                    ce('td',{style:{padding:'5px 8px',textAlign:'right',fontFamily:'var(--font-mono)'}}, fmt(Math.round(r.plan))),
                    ce('td',{style:{padding:'5px 8px',textAlign:'right',fontFamily:'var(--font-mono)'}}, fmt(Math.round(r.actual))),
                    ce('td',{style:{padding:'5px 8px',textAlign:'right',fontFamily:'var(--font-mono)',color:d>=0?'var(--green)':'var(--amber)'}}, (d>=0?'+':'')+fmt(Math.round(d))),
                    ce('td',{style:{padding:'5px 8px',textAlign:'right',fontFamily:'var(--font-mono)',color:d>=0?'var(--green)':'var(--amber)'}}, (dp>=0?'+':'')+dp+'%')); }))))));
      }
    }
  }
  return ce('div',null,
    ce('div',{className:'bt-tabs'}, tabBtn('cohort','Cohort comparison'), tabBtn('matrix','Rootstock × variety'), tabBtn('age','Age curve'), tabBtn('plan','Plan vs actual')),
    filterBar,
    body);
}

/* ── Land Cloud mark (surveyed parcel): dashed boundary = total area, solid mint
   interior = bearing area. light=true → Teal & Sand (on white); else dark-bg mint. ── */
function lcMark(size,light){
  var bd=light?'#159490':'#5fc9c4', pl=light?'#0d6a68':'#8fe0ad';
  return ce('svg',{width:size,height:size,viewBox:'0 0 64 64',fill:'none','aria-hidden':'true',style:{flex:'none',display:'block'}},
    ce('path',{d:'M8 22 L27 6 L52 13 L58 36 L39 56 L14 48 Z',stroke:bd,strokeWidth:2.4,strokeLinejoin:'round',strokeDasharray:'6.5 5',opacity:0.9}),
    ce('path',{d:'M19 25 L30 17 L45 21 L48 34 L36 45 L22 40 Z',fill:pl}),
    ce('g',{fill:bd}, [[8,22],[27,6],[52,13],[58,36],[39,56],[14,48]].map(function(pt,i){ return ce('circle',{key:i,cx:pt[0],cy:pt[1],r:2.9}); })));
}

/* ── Access gate: farm_can_read() decides entry; users.role gates writes. ── */
function App(){
  var a=useState({phase:'boot',session:null,role:null,canRead:false}); var auth=a[0], setAuth=a[1];
  var n=useState('structure'); var screen=n[0], setScreen=n[1];
  var c=useState('all'); var crop=c[0], setCrop=c[1];
  var y=useState(2025); var season=y[0], setSeason=y[1];
  var p=useState([]); var products=p[0], setProducts=p[1];
  var m=useState(false); var menuOpen=m[0], setMenu=m[1];
  // Farm Map controls live in the sidebar; state is lifted here so the sub-panel and the screen share it
  var mf=useState('all'); var mapFarm=mf[0], setMapFarm=mf[1];
  var mmd=useState('crop'); var mapMode=mmd[0], setMapMode=mmd[1];
  var mof=useState([]); var mapOff=mof[0], setMapOff=mof[1];
  var mmt=useState(null); var mapMeta=mmt[0], setMapMeta=mmt[1];

  useEffect(function(){
    var sub = supabase.auth.onAuthStateChange(function(_e, sess){ boot(sess); });
    supabase.auth.getSession().then(function(r){ boot(r.data.session); });
    return function(){ try{ sub.data.subscription.unsubscribe(); }catch(e){} };
  }, []);

  function boot(sess){
    if(!sess){ setAuth({phase:'login',session:null,role:null,canRead:false}); return; }
    Promise.all([
      supabase.rpc('farm_can_read'),
      supabase.from('users').select('role,full_name,email').eq('id', sess.user.id).maybeSingle()
    ]).then(function(r){
      var canRead = r[0].data === true;
      var row = r[1].data || {};
      setAuth({phase: canRead?'in':'noaccess', session:sess, role:row.role||null, name:row.full_name||sess.user.email, canRead:canRead});
    }).catch(function(){ setAuth({phase:'noaccess',session:sess,role:null,canRead:false}); });
  }
  useEffect(function(){ // crop list, once we're in
    if(auth.phase!=='in') return;
    supabase.from('products').select('id,name,color,bg_color,border_color').then(function(r){
      var rows=(r.data||[]).filter(function(x){ return ['citrus','grapes','mango','pomegranate','olives','berries'].indexOf(x.id)>=0; });
      setProducts(rows);
    });
  }, [auth.phase]);

  if(auth.phase==='boot') return ce('div',{className:'login-wrap'}, ce('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}, lcMark(52,false), ce('div',{style:{fontFamily:'var(--font-display)',fontSize:22}}, ce('span',{style:{color:'#f4f1e8'}},'Dal'), ce('span',{style:{color:'#5fc9c4'}},'OS'), ce('span',{style:{color:'#f4f1e8'}},' Land Cloud'))));
  if(auth.phase==='login') return ce(Login,null);
  if(auth.phase==='noaccess') return ce(NoAccess,{email:(auth.session&&auth.session.user.email)});

  var role = auth.role;
  var isAdmin = ['admin','power_user'].indexOf(role)>=0;
  var canWrite = isAdmin || role==='agronomy_admin';
  var visible = function(it){ if(it.need==='admin') return isAdmin; return true; };
  var mapApi = {farm:mapFarm,setFarm:setMapFarm,mode:mapMode,setMode:setMapMode,off:mapOff,setOff:setMapOff,meta:mapMeta,setMeta:setMapMeta};
  var ctx = {crop:crop, season:season, role:role, canWrite:canWrite, isAdmin:isAdmin, products:products, go:setScreen, map:mapApi};
  var scr = SCREENS[screen];

  return ce('div',{className:'app'},
    ce('div',{className:'sidebar-overlay'+(menuOpen?' on':''),onClick:function(){setMenu(false);}}),
    ce('div',{className:'sidebar'+(menuOpen?' open':'')},
      ce('div',{className:'logo'},
        ce('div',{style:{display:'flex',alignItems:'center',gap:10}},
          lcMark(30,false),
          ce('div',null,
            ce('div',{style:{fontFamily:'var(--font-display)',fontSize:13.5,lineHeight:1,letterSpacing:'.01em'}}, ce('span',{style:{color:'#bdd8d6'}},'Dal'), ce('span',{style:{color:'#5fc9c4'}},'OS')),
            ce('div',{className:'logo-name',style:{fontSize:17,marginTop:2}},'Land Cloud')))),
      ce('div',{className:'nav'}, NAV.map(function(g){
        return ce('div',{key:g.sec},
          ce('div',{className:'nav-section'}, g.sec),
          g.items.filter(visible).map(function(it){
            return ce('button',{key:it.k,className:'nav-item'+(screen===it.k?' active':''),onClick:function(){setScreen(it.k);setMenu(false);}},
              ce(it.Icon,null), ce('span',null, it.label),
              it.v2?ce('span',{style:{marginLeft:'auto',fontSize:9,opacity:.6}},'v2'):null);
          }),
          (g.sec==='Explore'&&screen==='map')?ce(MapNavSub,{m:mapApi}):null);
      })),
      ce('div',{className:'side-foot'},
        ce('div',{className:'side-user'}, auth.name||'—'),
        ce('div',{className:'side-role'}, role||'no role'),
        ce('button',{className:'side-link',onClick:function(){ window.location.href='https://daltexcorp-opsexcellence.github.io/dalos-workspace-dev/'; }}, '← Workspace'),
        ce('button',{className:'side-link',onClick:function(){ supabase.auth.signOut(); }}, 'Sign out'),
        ce('div',{className:'side-build'}, BUILD))
    ),
    ce('div',{className:'main'},
      ce('div',{className:'topbar'},
        ce('button',{className:'menu-btn',onClick:function(){setMenu(!menuOpen);}}, '☰'),
        ce('h1',null, scr.title),
        ce('div',{className:'topbar-spacer'}),
        ce('span',{className:'tb-label'},'Crop'),
        ce('select',{className:'tb-select',value:crop,onChange:function(e){setCrop(e.target.value);}},
          ce('option',{value:'all'},'All crops'),
          products.map(function(pr){ return ce('option',{key:pr.id,value:pr.id}, pr.name); })),
        ce('span',{className:'tb-label'},'Season'),
        ce('select',{className:'tb-select',value:season,onChange:function(e){setSeason(+e.target.value);}},
          [2025,2024,2023,2022,2021,2020,2019,2018,2017].map(function(yy){ return ce('option',{key:yy,value:yy}, yy); })),
        ce('span',{className:'staging-badge'+(location.pathname.indexOf('-dev/')>=0?' on':''),title:'Staging environment'},
          ce('span',{className:'staging-dot'}), 'Staging')
      ),
      ce('div',{className:'page'},
        scr.body ? scr.body(ctx) : ce(Scaffold,{title:scr.title,phase:scr.phase,msg:scr.msg})
      )
    ),
    ce('div',{className:'bottom-nav'}, NAV.reduce(function(acc,g){ return acc.concat(g.items.filter(visible)); },[]).map(function(it){
      return ce('button',{key:it.k,className:'bn-item'+(screen===it.k?' active':''),onClick:function(){setScreen(it.k);}},
        ce(it.Icon,null), ce('span',null, it.label.split(' ')[0]));
    }))
  );
}

/* ── Login (users type their own credentials; SSO session usually pre-exists) ── */
function Login(){
  var e=useState(''); var f=useState(''); var b=useState({busy:false,err:null});
  var email=e[0],setEmail=e[1], pw=f[0],setPw=f[1], st=b[0],setSt=b[1];
  function submit(ev){ ev.preventDefault(); setSt({busy:true,err:null});
    supabase.auth.signInWithPassword({email:email.trim(),password:pw}).then(function(r){
      if(r.error) setSt({busy:false,err:r.error.message});
    }); }
  return ce('div',{className:'login-wrap'},
    ce('form',{className:'login-card',onSubmit:submit},
      ce('div',{style:{display:'flex',justifyContent:'center',marginBottom:14}}, lcMark(44,true)),
      ce('div',{className:'login-title'}, ce('span',{style:{color:'var(--text)'}},'Dal'), ce('span',{style:{color:'#159490'}},'OS'), ' Land Cloud'),
      ce('div',{className:'login-sub'},'Orchard block register & production history'),
      ce('label',{className:'form-label'},'Email'),
      ce('input',{className:'form-input',type:'email',value:email,onChange:function(e){setEmail(e.target.value);},autoComplete:'username'}),
      ce('label',{className:'form-label'},'Password'),
      ce('input',{className:'form-input',type:'password',value:pw,onChange:function(e){setPw(e.target.value);},autoComplete:'current-password'}),
      st.err? ce('div',{style:{color:'var(--red)',fontSize:12,marginTop:10}}, st.err):null,
      ce('button',{className:'btn btn-primary',style:{width:'100%',marginTop:18},disabled:st.busy,type:'submit'}, st.busy?'Signing in…':'Sign in')
    ));
}
function NoAccess(p){
  return ce('div',{className:'login-wrap'},
    ce('div',{className:'login-card'},
      ce('div',{className:'login-title',style:{fontSize:20}},'No access'),
      ce('div',{style:{fontSize:13,color:'var(--text2)',textAlign:'center',marginTop:12,lineHeight:1.6}},
        'Your account'+(p.email?(' ('+p.email+')'):'')+' is not granted to Land Cloud. Ask an admin for the agronomy or commercial role.'),
      ce('button',{className:'btn btn-secondary',style:{width:'100%',marginTop:20},onClick:function(){ supabase.auth.signOut(); }}, 'Sign out')));
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App));
setTimeout(function(){ var sp=document.getElementById('lc-splash'); if(sp){ sp.style.opacity='0'; setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); },480); } },300);
</script>
